<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>診金預算及 Invoice 管理</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              'Inter',
              'Segoe UI',
              'Noto Sans HK',
              'Noto Sans TC',
              'Arial',
              'sans-serif'
            ]
          }
        }
      }
    };
  </script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 34rem),
        radial-gradient(circle at top right, rgba(16, 185, 129, 0.16), transparent 30rem),
        linear-gradient(180deg, #f8fafc 0%, #eef6ff 52%, #f8fafc 100%);
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    .soft-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.95);
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.06);
      border-radius: 1.5rem;
    }

    .input {
      width: 100%;
      border-radius: 0.9rem;
      border: 1px solid #cbd5e1;
      background: rgba(255, 255, 255, 0.92);
      padding: 0.72rem 0.9rem;
      font-size: 0.95rem;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .input:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.16);
      background: #ffffff;
    }

    .label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: 9999px;
      padding: 0.72rem 1rem;
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #0284c7, #0f766e);
      box-shadow: 0 12px 24px rgba(14, 116, 144, 0.22);
    }

    .btn-primary:hover {
      box-shadow: 0 16px 30px rgba(14, 116, 144, 0.28);
    }

    .btn-secondary {
      color: #0f172a;
      background: white;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #f8fafc;
    }

    .btn-danger {
      color: #fff;
      background: #e11d48;
    }

    .btn-danger:hover {
      background: #be123c;
    }

    .btn-ghost {
      color: #334155;
      background: transparent;
    }

    .btn-ghost:hover {
      background: rgba(241, 245, 249, 0.9);
    }

    .scrollbar-thin::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }

    .calendar-cell {
      min-height: 6.25rem;
    }

    @media (max-width: 640px) {
      .calendar-cell {
        min-height: 5.25rem;
      }
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        background: white !important;
      }

      .soft-card,
      .glass {
        box-shadow: none !important;
        border-color: #e2e8f0 !important;
      }
    }
  </style>
</head>

<body
  x-data="uiApp()"
  x-init="uiInit()"
  x-cloak
  class="font-sans text-slate-900 selection:bg-sky-200 selection:text-slate-950"
>
  <!-- Loading overlay -->
  <div
    x-show="loading"
    x-transition.opacity
    class="fixed inset-0 z-50 flex items-center justify-center bg-white/70 backdrop-blur-sm"
  >
    <div class="glass rounded-3xl px-6 py-5 text-center">
      <div class="mx-auto mb-3 h-10 w-10 animate-spin rounded-full border-4 border-sky-200 border-t-sky-600"></div>
      <p class="text-sm font-bold text-slate-700">載入中...</p>
    </div>
  </div>

  <!-- Auth screen -->
  <section
    x-show="!uiHasUser()"
    x-transition.opacity
    class="flex min-h-screen items-center justify-center px-4 py-10"
  >
    <div class="w-full max-w-md">
      <div class="mb-6 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-3xl bg-gradient-to-br from-sky-500 to-emerald-500 text-3xl shadow-xl shadow-sky-200">
          🩺
        </div>
        <h1 class="text-3xl font-black tracking-tight text-slate-950">診金預算</h1>
        <p class="mt-2 text-sm font-medium text-slate-500">
          更表、每日診金、分成、Invoice 一次過管理
        </p>
      </div>

      <form @submit.prevent="uiAuth()" class="glass rounded-3xl p-5 sm:p-7">
        <div class="mb-5">
          <h2 class="text-xl font-black text-slate-950">登入</h2>
          <p class="mt-1 text-sm text-slate-500">輸入你 Supabase Auth 嘅 email 及 password。</p>
        </div>

        <div class="space-y-4">
          <label>
            <span class="label">Email</span>
            <input
              type="email"
              x-model="email"
              autocomplete="email"
              class="input"
              placeholder="you@example.com"
              required
            />
          </label>

          <label>
            <span class="label">Password</span>
            <input
              type="password"
              x-model="password"
              autocomplete="current-password"
              class="input"
              placeholder="••••••••"
              required
            />
          </label>
        </div>

        <template x-if="errorMsg">
          <div class="mt-4 rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-semibold text-rose-700">
            <span x-text="errorMsg"></span>
          </div>
        </template>

        <div class="mt-6 flex flex-col gap-3 sm:flex-row">
          <button type="submit" class="btn btn-primary flex-1">
            登入
          </button>
          <button type="button" @click="uiRegister()" class="btn btn-secondary flex-1">
            註冊
          </button>
        </div>

        <p class="mt-5 text-center text-xs leading-relaxed text-slate-400">
          建議用手機加入主畫面，會似 app 咁用。
        </p>
      </form>
    </div>
  </section>

  <!-- Main app -->
  <template x-if="uiHasUser()">
    <div class="min-h-screen pb-24 lg:pb-0">
      <!-- Top bar -->
      <header class="sticky top-0 z-40 border-b border-white/70 bg-white/75 backdrop-blur-xl no-print">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-3 sm:px-6 lg:px-8">
          <div class="min-w-0">
            <div class="flex items-center gap-3">
              <div class="hidden h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-sky-500 to-emerald-500 text-xl shadow-lg shadow-sky-100 sm:flex">
                🩺
              </div>
              <div class="min-w-0">
                <p class="truncate text-xs font-black uppercase tracking-widest text-sky-700">
                  Clinic Income
                </p>
                <h1 class="truncate text-lg font-black tracking-tight text-slate-950 sm:text-xl">
                  診金預算及 Invoice
                </h1>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <div class="hidden items-center rounded-full border border-slate-200 bg-white p-1 shadow-sm sm:flex">
              <button type="button" @click="uiMonthMove(-1)" class="btn btn-ghost px-3 py-2">
                ‹
              </button>
              <button type="button" @click="uiSetToday()" class="btn btn-ghost px-3 py-2">
                今日
              </button>
              <button type="button" @click="uiMonthMove(1)" class="btn btn-ghost px-3 py-2">
                ›
              </button>
            </div>

            <button type="button" @click="uiSignOut()" class="btn btn-secondary px-4 py-3">
              登出
            </button>
          </div>
        </div>
      </header>

      <div class="mx-auto grid max-w-7xl gap-5 px-4 py-5 sm:px-6 lg:grid-cols-12 lg:px-8">
        <!-- Desktop sidebar -->
        <aside class="hidden lg:col-span-3 lg:block xl:col-span-2 no-print">
          <nav class="glass sticky top-24 rounded-3xl p-2">
            <template x-for="item in uiNavItems" :key="item.id">
              <button
                type="button"
                @click="uiSetView(item.id)"
                class="mb-1 flex w-full items-center gap-3 rounded-2xl px-4 py-3 text-left text-sm font-black transition"
                :class="uiIsView(item.id)
                  ? 'bg-slate-950 text-white shadow-lg shadow-slate-200'
                  : 'text-slate-600 hover:bg-white hover:text-slate-950'"
              >
                <span class="text-lg" x-text="item.icon"></span>
                <span x-text="item.label"></span>
              </button>
            </template>
          </nav>
        </aside>

        <!-- Main content -->
        <main class="lg:col-span-9 xl:col-span-10">
          <!-- Month hero -->
          <section class="glass mb-5 overflow-hidden rounded-3xl">
            <div class="bg-gradient-to-br from-slate-950 via-sky-950 to-teal-900 p-5 text-white sm:p-7">
              <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
                <div>
                  <p class="text-xs font-black uppercase tracking-widest text-sky-200">
                    Current month
                  </p>
                  <div class="mt-2 flex flex-wrap items-center gap-3">
                    <h2 class="text-3xl font-black tracking-tight sm:text-4xl" x-text="uiMonthLabel()"></h2>
                    <span class="rounded-full bg-white/15 px-3 py-1 text-xs font-black text-sky-100 ring-1 ring-white/20">
                      <span x-text="uiCalendarGrid().filter(d => !d.__blank).length"></span> 日
                    </span>
                  </div>
                  <p class="mt-3 max-w-2xl text-sm leading-relaxed text-slate-300">
                    一眼睇晒預算、實際分成、未填記錄同 invoice 狀態。
                  </p>
                </div>

                <div class="flex items-center rounded-full bg-white/10 p-1 ring-1 ring-white/15 sm:hidden">
                  <button type="button" @click="uiMonthMove(-1)" class="btn px-4 py-3 text-white hover:bg-white/10">
                    ‹
                  </button>
                  <button type="button" @click="uiSetToday()" class="btn px-4 py-3 text-white hover:bg-white/10">
                    今日
                  </button>
                  <button type="button" @click="uiMonthMove(1)" class="btn px-4 py-3 text-white hover:bg-white/10">
                    ›
                  </button>
                </div>

                <div class="rounded-3xl bg-white/10 p-4 ring-1 ring-white/15">
                  <p class="text-xs font-black uppercase tracking-widest text-sky-200">本月預計</p>
                  <p class="mt-1 text-3xl font-black tracking-tight" x-text="uiMoney(uiExpectedTotal())"></p>
                </div>
              </div>
            </div>
          </section>

          <!-- DASHBOARD -->
          <section x-show="uiIsView('dashboard')" x-transition.opacity>
            <!-- KPI cards -->
            <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
              <div class="soft-card p-5">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs font-black uppercase tracking-widest text-slate-400">預計總收入</p>
                    <p class="mt-2 text-2xl font-black text-slate-950" x-text="uiMoney(uiExpectedTotal())"></p>
                  </div>
                  <div class="rounded-2xl bg-sky-50 p-3 text-xl">💰</div>
                </div>
                <p class="mt-4 text-xs font-semibold text-slate-500">包括固定、時薪、估算分成及加節。</p>
              </div>

              <div class="soft-card p-5">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs font-black uppercase tracking-widest text-slate-400">實際分成</p>
                    <p class="mt-2 text-2xl font-black text-emerald-700" x-text="uiMoney(uiActualTotal())"></p>
                  </div>
                  <div class="rounded-2xl bg-emerald-50 p-3 text-xl">✅</div>
                </div>
                <p class="mt-4 text-xs font-semibold text-slate-500">根據每日已輸入診金計算。</p>
              </div>

              <div class="soft-card p-5">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs font-black uppercase tracking-widest text-slate-400">估算分成</p>
                    <p class="mt-2 text-2xl font-black text-cyan-700" x-text="uiMoney(uiEstimatedShare())"></p>
                  </div>
                  <div class="rounded-2xl bg-cyan-50 p-3 text-xl">📈</div>
                </div>
                <p class="mt-4 text-xs font-semibold text-slate-500">未填實際診金前用設定估算。</p>
              </div>

              <div class="soft-card p-5">
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs font-black uppercase tracking-widest text-slate-400">未處理</p>
                    <p class="mt-2 text-2xl font-black text-amber-700">
                      <span x-text="uiMissingCount()"></span>
                      <span class="text-base">項</span>
                    </p>
                  </div>
                  <div class="rounded-2xl bg-amber-50 p-3 text-xl">⚠️</div>
                </div>
                <p class="mt-4 text-xs font-semibold text-slate-500">
                  Invoice 逾期：
                  <span class="font-black text-rose-600" x-text="uiOverdueCount()"></span>
                </p>
              </div>
            </div>

            <!-- Calendar + selected detail -->
            <div class="mt-5 grid gap-5 xl:grid-cols-12">
              <section class="soft-card p-4 sm:p-5 xl:col-span-8">
                <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <h3 class="text-lg font-black text-slate-950">月曆</h3>
                    <p class="mt-1 text-sm text-slate-500">按日期可睇詳細 session 及金額。</p>
                  </div>

                  <div class="flex flex-wrap gap-2 text-xs font-black">
                    <span class="rounded-full bg-emerald-50 px-3 py-1 text-emerald-700 ring-1 ring-emerald-100">已填</span>
                    <span class="rounded-full bg-amber-50 px-3 py-1 text-amber-700 ring-1 ring-amber-100">待填</span>
                    <span class="rounded-full bg-sky-50 px-3 py-1 text-sky-700 ring-1 ring-sky-100">預計</span>
                    <span class="rounded-full bg-slate-50 px-3 py-1 text-slate-500 ring-1 ring-slate-100">休息</span>
                  </div>
                </div>

                <div class="grid grid-cols-7 gap-2 text-center text-xs font-black text-slate-400">
                  <div>一</div>
                  <div>二</div>
                  <div>三</div>
                  <div>四</div>
                  <div>五</div>
                  <div>六</div>
                  <div>日</div>
                </div>

                <div class="mt-2 grid grid-cols-7 gap-2">
                  <template x-for="(day, idx) in uiCalendarGrid()" :key="day.__key || idx">
                    <button
                      type="button"
                      class="calendar-cell rounded-2xl border p-2 text-left transition"
                      :class="uiDayClass(day)"
                      :disabled="day.__blank"
                      @click="uiSelectDay(day)"
                    >
                      <template x-if="day.__blank">
                        <div></div>
                      </template>

                      <template x-if="!day.__blank">
                        <div class="flex h-full flex-col">
                          <div class="flex items-start justify-between gap-1">
                            <span
                              class="flex h-7 w-7 items-center justify-center rounded-full text-sm font-black"
                              :class="uiIsToday(day) ? 'bg-slate-950 text-white' : 'text-slate-800'"
                              x-text="uiDayNumber(day)"
                            ></span>

                            <span
                              class="rounded-full px-2 py-1 text-xs font-black"
                              :class="uiDayStatusClass(day)"
                              x-text="uiDayStatusLabel(day)"
                            ></span>
                          </div>

                          <div class="mt-2 flex flex-wrap gap-1">
                            <template x-for="clinic in uiDayClinics(day).slice(0, 2)" :key="uiClinicKey(clinic)">
                              <span
                                class="rounded-full px-2 py-1 text-xs font-black ring-1"
                                :class="uiClinicBadgeClass(clinic)"
                                x-text="uiClinicCode(clinic)"
                              ></span>
                            </template>

                            <template x-if="uiDayClinics(day).length > 2">
                              <span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-black text-slate-500">
                                +<span x-text="uiDayClinics(day).length - 2"></span>
                              </span>
                            </template>
                          </div>

                          <div class="mt-auto pt-2">
                            <template x-if="uiDayActual(day) > 0">
                              <p class="truncate text-xs font-black text-emerald-700" x-text="uiMoney(uiDayActual(day))"></p>
                            </template>
                            <template x-if="uiDayActual(day) <= 0 && uiDayEstimate(day) > 0">
                              <p class="truncate text-xs font-black text-sky-700" x-text="uiMoney(uiDayEstimate(day))"></p>
                            </template>
                          </div>
                        </div>
                      </template>
                    </button>
                  </template>
                </div>
              </section>

              <aside class="soft-card p-5 xl:col-span-4">
                <div class="mb-4 flex items-start justify-between gap-3">
                  <div>
                    <h3 class="text-lg font-black text-slate-950">選中日子</h3>
                    <p class="mt-1 text-sm text-slate-500" x-text="uiSelectedDateLabel()"></p>
                  </div>
                  <span
                    class="rounded-full px-3 py-1 text-xs font-black"
                    :class="uiDayStatusClass(uiSelectedDayObj())"
                    x-text="uiDayStatusLabel(uiSelectedDayObj())"
                  ></span>
                </div>

                <div class="grid grid-cols-2 gap-3">
                  <div class="rounded-2xl bg-slate-50 p-4">
                    <p class="text-xs font-black uppercase tracking-widest text-slate-400">預計</p>
                    <p class="mt-1 text-xl font-black text-slate-950" x-text="uiMoney(uiDayEstimate(uiSelectedDayObj()))"></p>
                  </div>
                  <div class="rounded-2xl bg-emerald-50 p-4">
                    <p class="text-xs font-black uppercase tracking-widest text-emerald-500">實際</p>
                    <p class="mt-1 text-xl font-black text-emerald-700" x-text="uiMoney(uiDayActual(uiSelectedDayObj()))"></p>
                  </div>
                </div>

                <div class="mt-5">
                  <h4 class="mb-3 text-sm font-black text-slate-700">診所 / Session</h4>

                  <template x-if="uiDayClinics(uiSelectedDayObj()).length === 0">
                    <div class="rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-5 text-center text-sm font-semibold text-slate-400">
                      呢日未見到固定更或加節。
                    </div>
                  </template>

                  <div class="space-y-3">
                    <template x-for="clinic in uiDayClinics(uiSelectedDayObj())" :key="uiClinicKey(clinic)">
                      <div class="rounded-2xl border border-slate-200 bg-white p-4">
                        <div class="flex items-start justify-between gap-3">
                          <div>
                            <p class="font-black text-slate-950" x-text="uiClinicName(clinic)"></p>
                            <p class="mt-1 text-xs font-semibold text-slate-500" x-text="uiSessionMeta(clinic)"></p>
                          </div>
                          <span
                            class="rounded-full px-2.5 py-1 text-xs font-black ring-1"
                            :class="uiClinicBadgeClass(clinic)"
                            x-text="uiClinicCode(clinic)"
                          ></span>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>

                <div class="mt-5 flex flex-col gap-2 sm:flex-row xl:flex-col">
                  <button type="button" @click="uiSetView('records')" class="btn btn-primary flex-1">
                    填每日記錄
                  </button>
                  <button type="button" @click="uiSetView('adjustments')" class="btn btn-secondary flex-1">
                    加節 / 休假
                  </button>
                </div>
              </aside>
            </div>
          </section>

          <!-- RECORDS -->
          <section x-show="uiIsView('records')" x-transition.opacity>
            <div class="grid gap-5 xl:grid-cols-12">
              <section class="soft-card p-5 xl:col-span-5">
                <div class="mb-5">
                  <h2 class="text-xl font-black text-slate-950">每日記錄</h2>
                  <p class="mt-1 text-sm text-slate-500">填每日診金、小手術及備註，用嚟計實際分成。</p>
                </div>

                <form @submit.prevent="uiSaveDaily()" class="space-y-4">
                  <label>
                    <span class="label">日期</span>
                    <input
                      type="date"
                      x-model="selectedDate"
                      @change="uiSyncSelectedDate()"
                      class="input"
                    />
                  </label>

                  <label>
                    <span class="label">診所</span>
                    <select x-model="dailyForm.clinic_id" class="input" required>
                      <option value="">選擇診所</option>
                      <template x-for="clinic in clinics" :key="clinic.id || clinic.code || clinic.name">
                        <option :value="clinic.id" x-text="uiClinicName(clinic)"></option>
                      </template>
                    </select>
                  </label>

                  <div class="grid grid-cols-2 gap-3">
                    <label>
                      <span class="label">診金總數</span>
                      <input
                        type="number"
                        min="0"
                        step="0.01"
                        x-model.number="dailyForm.consultation_total"
                        class="input"
                        placeholder="0"
                      />
                    </label>

                    <label>
                      <span class="label">小手術總數</span>
                      <input
                        type="number"
                        min="0"
                        step="0.01"
                        x-model.number="dailyForm.minor_total"
                        class="input"
                        placeholder="0"
                      />
                    </label>
                  </div>

                  <div class="grid grid-cols-2 gap-3">
                    <label>
                      <span class="label">實收 / 診所收入</span>

        ],

        async uiInit() {
          this.uiEnsureDefaults();

          if (typeof this.init === 'function') {
            try {
              await this.init();
            } catch (err) {
              console.error(err);
              this.errorMsg = err && err.message ? err.message : '初始化失敗';
            }
          }

          this.uiEnsureDefaults();
          this.uiSyncSelectedDate();
        },

        uiEnsureDefaults() {
          const now = new Date();

          if (!this.year) this.year = now.getFullYear();
          if (!this.month) this.month = now.getMonth() + 1;

          this.profile = this.profile || {};
          this.clinics = Array.isArray(this.clinics) ? this.clinics : [];
          this.rules = Array.isArray(this.rules) ? this.rules : [];
          this.leaves = Array.isArray(this.leaves) ? this.leaves : [];
          this.overrides = Array.isArray(this.overrides) ? this.overrides : [];
          this.extras = Array.isArray(this.extras) ? this.extras : [];
          this.invoices = Array.isArray(this.invoices) ? this.invoices : [];

          if (!Array.isArray(this.dailyLogs)) {
            this.dailyLogs = Array.isArray(this.logs) ? this.logs : [];
          }

          if (!this.selectedDate) this.selectedDate = toISODate(now);

          this.dailyForm = {
            date: this.selectedDate,
            clinic_id: '',
            consultation_total: 0,
            minor_total: 0,
            gross_total: 0,
            worked: 'yes',
            note: '',

          };

          this.clinicForm = {
            name: '',
            code: '',
            default_fee: 0,
            share_percent: 0,
            ...(this.clinicForm || {})
          };

          this.ruleForm = {
            clinic_id: '',
            weekday: 1,
            start_time: '',
            end_time: '',
            fixed_fee: 0,
            ...(this.ruleForm || {})
          };

          this.leaveForm = {
            clinic_id: '',
            start: this.selectedDate,
            end: this.selectedDate,
            type: 'annual',
            note: '',
            ...(this.leaveForm || {})
          };

          this.extraForm = {
            date: this.selectedDate,
            clinic_id: '',
            start_time: '',
            end_time: '',
            fixed_fee: 0,
            hourly_rate: 0,
            note: '',
            ...(this.extraForm || {})
          };

          this.overrideForm = {
            date: this.selectedDate,
            clinic_id: '',
            action: 'cancel',
            note: '',
            ...(this.overrideForm || {})
          };

          if (!this.uiView) {
            this.uiView = this.view || this.tab || 'dashboard';
          }
        },

        uiHasUser() {
          return !!(
            this.user ||
            this.currentUser ||
            this.authUser ||
            (this.session && this.session.user) ||
            this.loggedIn ||
            this.isAuthed
          );
        },

        uiSetView(view) {
          this.uiView = view;
          this.view = view;
          this.tab = view;
        },

        uiIsView(view) {
          return (this.uiView || this.view || this.tab) === view;
        },

        async uiAuth() {
          this.errorMsg = '';

          const names = ['signIn', 'signin', 'login', 'logIn'];
          for (const name of names) {
            if (typeof this[name] === 'function') {
              try {
                return await this[name](this.email, this.password);
              } catch (err) {
                console.error(err);
                this.errorMsg = err && err.message ? err.message : '登入失敗';
                return;
              }
            }
          }

          this.errorMsg = '搵唔到登入 function。請確認 app.js 有 login/signIn。';
        },

        async uiRegister() {
          this.errorMsg = '';

          const names = ['signUp', 'signup', 'register', 'createAccount'];
          for (const name of names) {
            if (typeof this[name] === 'function') {
              try {
                return await this[name](this.email, this.password);
              } catch (err) {
                console.error(err);
                this.errorMsg = err && err.message ? err.message : '註冊失敗';
                return;
              }
            }
          }

          this.errorMsg = '搵唔到註冊 function。請確認 app.js 有 signUp/register。';
        },

        async uiSignOut() {
          await this.uiCall(['signOut', 'logout', 'logOut']);
        },

        async uiCall(names, ...args) {
          const list = Array.isArray(names) ? names : [names];

          for (const name of list) {
            if (typeof this[name] === 'function') {
              try {
                return await this[name](...args);
              } catch (err) {
                console.error(err);
                this.errorMsg = err && err.message ? err.message : '操作失敗';
                return undefined;
              }
            }
          }

          return undefined;
        },

        async uiCallAll(names, ...args) {
          const list = Array.isArray(names) ? names : [names];

          for (const name of list) {
            if (typeof this[name] === 'function') {
              try {
                await this[name](...args);
              } catch (err) {
                console.warn('uiCallAll failed:', name, err);
              }
            }
          }
        },

        async uiRefreshData() {
          await this.uiCallAll([
            'load',
            'reload',
            'refresh',
            'loadData',
            'fetchData',
            'loadDailyLogs',
            'loadInvoices'
          ], this.year, this.month);

          await this.uiAfterMonthChange(false);
        },

        async uiRefreshInvoices() {
          await this.uiCallAll(['loadInvoices', 'fetchInvoices', 'refreshInvoices'], this.year, this.month);
        },

        async uiAfterMonthChange(shouldLoad) {
          this.uiEnsureDefaults();

          if (shouldLoad) {
            await this.uiCallAll([
              'loadMonth',
              'loadDailyLogs',
              'loadInvoices',
              'refreshMonth'
            ], this.year, this.month);
          }

          await this.uiCallAll([
            'buildCal',
            'buildCalendar',
            'rebuildCalendar',
            'recalculate',
            'summarize'
          ], this.year, this.month);
        },

        async uiMonthMove(delta) {
          if (delta < 0 && typeof this.prevMonth === 'function') {
            await this.prevMonth();
            this.uiEnsureDefaults();
            return;
          }

          if (delta > 0 && typeof this.nextMonth === 'function') {
            await this.nextMonth();
            this.uiEnsureDefaults();
            return;
          }

          const d = new Date(Number(this.year), Number(this.month) - 1 + delta, 1);
          this.year = d.getFullYear();
          this.month = d.getMonth() + 1;

          await this.uiAfterMonthChange(true);
        },

        async uiSetToday() {
          const d = new Date();
          this.year = d.getFullYear();
          this.month = d.getMonth() + 1;
          this.selectedDate = toISODate(d);
          this.uiSyncSelectedDate();

          await this.uiAfterMonthChange(true);
        },

        uiMonthLabel() {
          return `${this.year}年${this.month}月`;
        },

        uiMoney(value) {
          const n = this.uiNum(value);
          return new Intl.NumberFormat('zh-HK', {
            style: 'currency',
            currency: 'HKD',
            maximumFractionDigits: 0
          }).format(n);
        },

        uiNum(value) {
          if (value === null || value === undefined || value === '') return 0;
          if (typeof value === 'number') return Number.isFinite(value) ? value : 0;

          const cleaned = String(value).replace(/[^\d.-]/g, '');
          const n = Number(cleaned);

          return Number.isFinite(n) ? n : 0;
        },

        uiFirstNumber(obj, keys) {
          if (!obj) return 0;

          for (const key of keys) {
            if (obj[key] !== undefined && obj[key] !== null && obj[key] !== '') {
              return this.uiNum(obj[key]);
            }
          }

          return 0;
        },

        uiSummaryObj() {
          if (typeof this.summary === 'function') {
            try {
              return this.summary() || {};
            } catch (err) {
              return {};
            }
          }

          return this.summary || this.monthSummary || this.totals || this.calcSummary || {};
        },

        uiExpectedTotal() {
          const s = this.uiSummaryObj();

          const direct = this.uiFirstNumber(s, [
            'expectedTotal',
            'expected_total',
            'totalExpected',
            'total_expected',
            'estimatedTotal',
            'estimated_total',
            'budgetTotal',
            'budget_total',
            'total'
          ]);

          if (direct > 0) return direct;

          return this.uiCalendarGrid().reduce((sum, day) => {
            return sum + this.uiDayEstimate(day);
          }, 0);
        },

        uiActualTotal() {
          const s = this.uiSummaryObj();

          const direct = this.uiFirstNumber(s, [
            'actualShare',
            'actual_share',
            'shareActual',
            'share_actual',
            'actualTotal',
            'actual_total',
            'totalActual',
            'total_actual',
            'actual'
          ]);

          if (direct > 0) return direct;

          return this.uiCalendarGrid().reduce((sum, day) => {
            return sum + this.uiDayActual(day);
          }, 0);
        },

        uiEstimatedShare() {
          const s = this.uiSummaryObj();

          return this.uiFirstNumber(s, [
            'estimatedShare',
            'estimated_share',
            'shareEstimate',
            'share_estimate',
            'estimateShare',
            'estimate_share',
            'estShare',
            'est_share'
          ]);
        },

        uiMissingCount() {
          const s = this.uiSummaryObj();

          const direct = this.uiFirstNumber(s, [
            'missing',
            'missingCount',
            'missing_count',
            'missingLogs',
            'missing_logs'
          ]);

          if (direct > 0) return direct;

          const today = toISODate(new Date());

          return this.uiCalendarGrid().filter(day => {
            if (!day || day.__blank) return false;
            const iso = this.uiDayIso(day);
            return iso <= today && this.uiDayClinics(day).length > 0 && this.uiDayActual(day) <= 0;
          }).length;
        },

        uiOverdueCount() {
          return this.uiInvoiceList().filter(inv => this.uiInvoiceStatus(inv) === 'overdue').length;
        },

        uiRawCalendarDays() {
          let raw =
            this.calDays ||
            this.calendarDays ||
            this.monthDays ||
            this.days ||
            this.cal ||
            this.calendar ||
            [];

          if (raw && Array.isArray(raw.weeks)) raw = raw.weeks.flat();
          if (raw && Array.isArray(raw.days)) raw = raw.days;
          if (raw && Array.isArray(raw.items)) raw = raw.items;
          if (Array.isArray(raw) && Array.isArray(raw[0])) raw = raw.flat();

          return Array.isArray(raw) ? raw : [];
        },

        uiCalendarGrid() {
          const y = Number(this.year);
          const m = Number(this.month);
          const raw = this.uiRawCalendarDays();

          const byIso = new Map();

          for (const item of raw) {
            const iso = this.uiDayIso(item);
            if (iso && this.uiIsoInMonth(iso, y, m)) {
              byIso.set(iso, { ...item, date: iso });
            }
          }

          const first = new Date(y, m - 1, 1);
          const last = new Date(y, m, 0);
          const leading = (first.getDay() + 6) % 7;

          const grid = [];

          for (let i = 0; i < leading; i++) {
            grid.push({ __blank: true, __key: `blank-start-${i}` });
          }

          for (let d = 1; d <= last.getDate(); d++) {
            const iso = makeISO(y, m, d);
            const item = byIso.get(iso) || { date: iso };
            grid.push({
              ...item,
              date: iso,
              __key: iso
            });
          }

          while (grid.length % 7 !== 0) {
            grid.push({ __blank: true, __key: `blank-end-${grid.length}` });
          }

          return grid;
        },

        uiDayIso(day) {
          if (!day) return '';

          if (typeof day === 'string') {
            return normalizeDateString(day);
          }

          if (day instanceof Date) {
            return toISODate(day);
          }

          const candidates = [
            day.date,
            day.iso,
            day.day_date,
            day.work_date,
            day.session_date,
            day.log_date
          ];

          for (const value of candidates) {
            const iso = normalizeDateString(value);
            if (iso) return iso;
          }

          if (typeof day.day === 'number') {
            return makeISO(Number(this.year), Number(this.month), day.day);
          }

          if (typeof day.d === 'number') {
            return makeISO(Number(this.year), Number(this.month), day.d);
          }

          return '';
        },

        uiIsoInMonth(iso, year, month) {
          if (!iso) return false;

          const y = Number(iso.slice(0, 4));
          const m = Number(iso.slice(5, 7));

          return y === Number(year) && m === Number(month);
        },

        uiDayNumber(day) {
          const iso = this.uiDayIso(day);
          if (!iso) return '';
          return Number(iso.slice(8, 10));
        },

        uiFormatDate(value) {
          const iso = normalizeDateString(value);
          if (!iso) return '';

          const d = new Date(`${iso}T00:00:00`);
          return new Intl.DateTimeFormat('zh-HK', {
            month: 'short',
            day: 'numeric',
            weekday: 'short'
          }).format(d);
        },

        uiSelectedDateLabel() {
          return this.uiFormatDate(this.selectedDate || this.uiDayIso(this.uiSelectedDayObj()));
        },

        uiIsToday(day) {
          return this.uiDayIso(day) === toISODate(new Date());
        },

        uiSelectDay(day) {
          if (!day || day.__blank) return;

          const iso = this.uiDayIso(day);

          this.selectedDay = day;
          this.selectedDate = iso;
          this.dailyForm.date = iso;
          this.extraForm.date = iso;
          this.overrideForm.date = iso;
          this.leaveForm.start = iso;
          this.leaveForm.end = iso;

          if (typeof this.selectDay === 'function') {
            try {
              this.selectDay(day);
            } catch (err) {
              console.warn(err);
            }
          }
        },

        uiSyncSelectedDate() {
          const iso = normalizeDateString(this.selectedDate) || toISODate(new Date());
          this.selectedDate = iso;

          const found = this.uiCalendarGrid().find(day => this.uiDayIso(day) === iso);
          if (found) this.selectedDay = found;

          this.dailyForm.date = iso;
          this.extraForm.date = iso;
          this.overrideForm.date = iso;
        },

        uiSelectedDayObj() {
          if (this.selectedDay && !this.selectedDay.__blank) {
            return this.selectedDay;
          }

          const iso = normalizeDateString(this.selectedDate);
          return this.uiCalendarGrid().find(day => this.uiDayIso(day) === iso) || { date: iso };
        },

        uiDayClinics(day) {
          if (!day || day.__blank) return [];

          const iso = this.uiDayIso(day);
          let list =
            day.clinics ||
            day.clinicList ||
            day.sessions ||
            day.shifts ||
            day.items ||
            day.works ||
            [];

          if (!Array.isArray(list) && list) {
            list = [list];
          }

          if ((!list || list.length === 0) && typeof this.recClinics === 'function') {
            try {
              const result = this.recClinics(iso);
              if (Array.isArray(result)) list = result;
            } catch (err) {
              console.warn(err);
            }
          }

          return (list || []).map(item => {
            if (!item) return item;

            if (typeof item === 'string' || typeof item === 'number') {
              return this.uiClinicById(item) || { id: item, name: String(item), code: String(item) };
            }

            if (item.clinic) {
              return { ...item.clinic, ...item };
            }

            if (item.clinic_id) {
              const clinic = this.uiClinicById(item.clinic_id);
              return clinic ? { ...clinic, ...item } : item;
            }

            return item;
          });
        },

        uiClinicById(id) {
          if (id === undefined || id === null || id === '') return null;

          return this.clinics.find(clinic => {
            return String(clinic.id) === String(id) ||
              String(clinic.clinic_id) === String(id) ||
              String(clinic.code) === String(id);
          }) || null;
        },

        uiClinicNameById(id) {
          const clinic = this.uiClinicById(id);
          return clinic ? this.uiClinicName(clinic) : '';
        },

        uiClinicName(clinic) {
          if (!clinic) return '診所';
          if (typeof clinic === 'string') return clinic;

          return clinic.name ||
            clinic.clinic_name ||
            clinic.title ||
            clinic.code ||
            clinic.short_code ||
            '診所';
        },

        uiClinicCode(clinic) {
          if (!clinic) return '--';
          if (typeof clinic === 'string') return clinic.slice(0, 4).toUpperCase();

          const raw =
            clinic.code ||
            clinic.short_code ||
            clinic.abbr ||
            clinic.clinic_code ||
            clinic.name ||
            clinic.clinic_name ||
            '--';

          return String(raw).trim().slice(0, 4).toUpperCase();
        },

        uiClinicKey(clinic) {
          if (!clinic) return Math.random().toString(36);
          if (typeof clinic === 'string' || typeof clinic === 'number') return String(clinic);

          return String(
            clinic.id ||
            clinic.clinic_id ||
            clinic.code ||
            clinic.short_code ||
            clinic.name ||
            JSON.stringify(clinic)
          );
        },

        uiClinicBadgeClass(clinic) {
          const code = this.uiClinicCode(clinic);
          const value = [...code].reduce((sum, ch) => sum + ch.charCodeAt(0), 0);
          const idx = value % 6;

          const classes = [
            'bg-sky-50 text-sky-700 ring-sky-100',
            'bg-emerald-50 text-emerald-700 ring-emerald-100',
            'bg-violet-50 text-violet-700 ring-violet-100',
            'bg-amber-50 text-amber-700 ring-amber-100',
            'bg-rose-50 text-rose-700 ring-rose-100',
            'bg-cyan-50 text-cyan-700 ring-cyan-100'
          ];

          return classes[idx];
        },

        uiSessionMeta(item) {
          if (!item || typeof item === 'string') return '';

          const start = item.start_time || item.start || item.from || '';
          const end = item.end_time || item.end || item.to || '';
          const fee = item.fixed_fee || item.fee || item.default_fee || '';

          const parts = [];

          if (start || end) {
            parts.push(`${start || '--:--'} - ${end || '--:--'}`);
          }

          if (fee) {
            parts.push(this.uiMoney(fee));
          }

          if (item.note) {
            parts.push(item.note);
          }

          return parts.join(' · ') || 'Session';
        },

        uiDayActual(day) {
          if (!day || day.__blank) return 0;

          return this.uiFirstNumber(day, [
            'actualShare',
            'actual_share',
            'shareActual',
            'share_actual',
            'actual',
            'actual_total',
            'daily_actual',
            'gross_total',
            'income',
            'total'
          ]);
        },

        uiDayEstimate(day) {
          if (!day || day.__blank) return 0;

          return this.uiFirstNumber(day, [
            'estimatedShare',
            'estimated_share',
            'estimateShare',
            'estimate_share',
            'estShare',
            'est_share',
            'estimated',
            'expected',
            'budget',
            'fixed_fee',
            'fee'
          ]);
        },

        uiDayStatus(day) {
          if (!day || day.__blank) return 'blank';

          const iso = this.uiDayIso(day);
          const clinics = this.uiDayClinics(day);
          const actual = this.uiDayActual(day);
          const estimate = this.uiDayEstimate(day);

          if (
            day.isHoliday ||
            day.holiday ||
            day.leave ||
            day.cancelled ||
            day.canceled ||
            day.skip ||
            day.off ||
            day.no_work
          ) {
            return 'off';
          }

          if (actual > 0 || day.logged || day.done) return 'done';

          if (clinics.length > 0 || estimate > 0) {
            if (iso && iso <= toISODate(new Date())) return 'missing';
            return 'planned';
          }

          return 'empty';
        },

        uiDayStatusLabel(day) {
          const status = this.uiDayStatus(day);

          const labels = {
            blank: '',
            empty: '空',
            off: '休',
            done: '已填',
            missing: '待填',
            planned: '預計'
          };

          return labels[status] || '';
        },

        uiDayStatusClass(day) {
          const status = this.uiDayStatus(day);

          const classes = {
            blank: '',
            empty: 'bg-slate-100 text-slate-400',
            off: 'bg-slate-100 text-slate-500',
            done: 'bg-emerald-100 text-emerald-700',
            missing: 'bg-amber-100 text-amber-700',
            planned: 'bg-sky-100 text-sky-700'
          };

          return classes[status] || 'bg-slate-100 text-slate-500';
        },

        uiDayClass(day) {
          if (!day || day.__blank) {
            return 'border-transparent bg-transparent cursor-default';
          }

          const selected = this.uiDayIso(day) === normalizeDateString(this.selectedDate);
          const status = this.uiDayStatus(day);

          let cls = 'border-slate-200 bg-white hover:border-sky-300 hover:bg-sky-50/50';

          if (status === 'done') cls = 'border-emerald-200 bg-emerald-50/45 hover:bg-emerald-50';
          if (status === 'missing') cls = 'border-amber-200 bg-amber-50/55 hover:bg-amber-50';
          if (status === 'planned') cls = 'border-sky-200 bg-sky-50/50 hover:bg-sky-50';
          if (status === 'off' || status === 'empty') cls = 'border-slate-200 bg-slate-50 hover:bg-slate-100';

          if (selected) {
            cls += ' ring-2 ring-slate-950 ring-offset-2';
          }

          return cls;
        },

        uiFilteredLogs() {
          const logs = Array.isArray(this.dailyLogs) && this.dailyLogs.length
            ? this.dailyLogs
            : Array.isArray(this.logs)
              ? this.logs
              : [];

          return logs
            .filter(log => this.uiIsoInMonth(normalizeDateString(log.date), this.year, this.month))
            .sort((a, b) => String(b.date).localeCompare(String(a.date)));
        },

        uiLogAmount(log) {
          return this.uiFirstNumber(log, [
            'actualShare',
            'actual_share',
            'share',
            'share_total',
            'amount',
            'gross_total',
            'total'
          ]);
        },

        async uiSaveDaily() {
          this.dailyForm.date = normalizeDateString(this.selectedDate);
          this.logForm = this.dailyForm;

          await this.uiCall([
            'saveDailyLog',
            'saveDaily',
            'saveLog',
            'upsertDailyLog',
            'upsertLog'
          ], this.dailyForm);

          await this.uiAfterMonthChange(true);
        },

        uiClearDailyForm() {
          this.dailyForm = {
            date: this.selectedDate,
            clinic_id: '',
            consultation_total: 0,
            minor_total: 0,
            gross_total: 0,
            worked: 'yes',
            note: ''
          };
        },

        uiInvoiceList() {
          const list = Array.isArray(this.invoices) ? this.invoices : [];

          return [...list]
            .filter(inv => {
              const sameMonth =
                (!inv.year || Number(inv.year) === Number(this.year)) &&
                (!inv.month || Number(inv.month) === Number(this.month));

              const sameClinic =
                !this.invoiceClinicId ||
                String(inv.clinic_id) === String(this.invoiceClinicId);

              return sameMonth && sameClinic;
            })
            .sort((a, b) => {
              const ak = `${a.year || 0}-${String(a.month || 0).padStart(2, '0')}-${a.created_at || ''}`;
              const bk = `${b.year || 0}-${String(b.month || 0).padStart(2, '0')}-${b.created_at || ''}`;
              return bk.localeCompare(ak);
            });
        },

        uiInvoiceAmount(inv) {
          return this.uiFirstNumber(inv, [
            'total',
            'total_amount',
            'amount',
            'invoice_total',
            'share_total',
            'subtotal',
            'grand_total'
          ]);
        },

        uiInvoiceStatus(inv) {
          if (!inv) return 'draft';

          const raw = String(inv.status || '').toLowerCase();

          if (raw.includes('paid') || inv.paid_at) return 'paid';
          if (raw.includes('sent')) return 'sent';
          if (raw.includes('void') || raw.includes('cancel')) return 'void';

          const due = normalizeDateString(inv.due_date);
          if (due && due < toISODate(new Date())) return 'overdue';

          return raw || 'draft';
        },

        uiInvoiceStatusLabel(inv) {
          const status = this.uiInvoiceStatus(inv);

          const labels = {
            paid: '已收款',
            sent: '已發出',
            overdue: '逾期',
            void: '已取消',
            draft: '草稿'
          };

          return labels[status] || status;
        },

        uiInvoiceStatusClass(inv) {
          const status = this.uiInvoiceStatus(inv);

          const classes = {
            paid: 'bg-emerald-100 text-emerald-700',
            sent: 'bg-sky-100 text-sky-700',
            overdue: 'bg-rose-100 text-rose-700',
            void: 'bg-slate-100 text-slate-500',
            draft: 'bg-amber-100 text-amber-700'
          };

          return classes[status] || 'bg-slate-100 text-slate-600';
        },

        async uiCreateInvoice() {
          this.invoiceForm = {
            clinic_id: this.invoiceClinicId,
            year: this.year,
            month: this.month
          };

          await this.uiCall([
            'createInvoice',
            'buildInvoice',
            'saveInvoice',
            'generateInvoice'
          ], this.invoiceForm);

          await this.uiRefreshInvoices();
        },

        async uiOpenInvoice(inv) {
          if (window.InvoiceDoc && typeof window.InvoiceDoc.open === 'function') {
            try {
              return window.InvoiceDoc.open(inv, this);
            } catch (err) {
              console.warn(err);
            }
          }

          await this.uiCall([
            'openInvoice',
            'printInvoice',
            'viewInvoice'
          ], inv);
        },

        async uiMarkInvoice(inv, status) {
          await this.uiCall([
            'markInvoice',
            'updateInvoiceStatus',
            'setInvoiceStatus'
          ], inv, status);

          await this.uiRefreshInvoices();
        },

        uiMonthItems(items) {
          if (!Array.isArray(items)) return [];

          return items.filter(item => {
            const iso = normalizeDateString(item.date || item.start || item.start_date || item.day);
            return this.uiIsoInMonth(iso, this.year, this.month);
          });
        },

        async uiSaveLeave() {
          this.leaveForm.start_date = this.leaveForm.start;
          this.leaveForm.end_date = this.leaveForm.end || this.leaveForm.start;
          this.leaveForm.date = this.leaveForm.start;

          await this.uiCall([
            'addLeave',
            'saveLeave',
            'createLeave',
            'addHoliday',
            'saveHoliday'
          ], this.leaveForm);

          await this.uiAfterMonthChange(true);
        },

        async uiSaveExtra() {
          await this.uiCall([
            'addExtra',
            'saveExtra',
            'createExtra',
            'addSpecialSession',
            'saveSpecialSession'
          ], this.extraForm);

          await this.uiAfterMonthChange(true);
        },

        async uiSaveOverride() {
          await this.uiCall([
            'addOverride',
            'saveOverride',
            'createOverride',
            'saveDayOverride'
          ], this.overrideForm);

          await this.uiAfterMonthChange(true);
        },

        async uiSaveProfile() {
          await this.uiCall([
            'saveProfile',
            'updateProfile',
            'upsertProfile'
          ], this.profile);
        },

        async uiSaveClinic() {
          await this.uiCall([
            'addClinic',
            'saveClinic',
            'createClinic'
          ], this.clinicForm);

          this.clinicForm = {
            name: '',
            code: '',
            default_fee: 0,
            share_percent: 0
          };

          await this.uiRefreshData();
        },

        async uiSaveRule() {
          await this.uiCall([
            'addRule',
            'saveRule',
            'createRule',
            'addRosterRule',
            'saveRosterRule'
          ], this.ruleForm);

          this.ruleForm = {
            clinic_id: '',
            weekday: 1,
            start_time: '',
            end_time: '',
            fixed_fee: 0
          };

          await this.uiAfterMonthChange(true);
        },

        uiWeekdayLabel(value) {
          const map = {
            0: '日',
            1: '一',
            2: '二',
            3: '三',
            4: '四',
            5: '五',
            6: '六'
          };

          return map[Number(value)] || value;
        }
      };
    }

    function toISODate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');

      return `${y}-${m}-${d}`;
    }

    function makeISO(year, month, day) {
      return `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function normalizeDateString(value) {
      if (!value) return '';

      if (value instanceof Date) {
        return toISODate(value);
      }

      const str = String(value).trim();

      if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
        return str.slice(0, 10);
      }

      const parsed = new Date(str);

      if (!Number.isNaN(parsed.getTime())) {
        return toISODate(parsed);
      }

      return '';
    }
  </script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
