<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173e37">
<title>Dr. Ray Leung Limited — Job Management</title>
<style>
:root{--bg:#f4f7fa;--ink:#172b3a;--muted:#687e8b;--line:#e1e9ee;--green:#197563;--dark:#173e37}
*{box-sizing:border-box}
[x-cloak]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{background:white;border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:auto;padding:18px}
header .wrap,.bar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .wrap,.bar{justify-content:space-between}
h1{font-size:25px;margin:0}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px}
p{margin:8px 0}
small,.muted{color:var(--muted)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:white;border:1px solid #cbd9df;border-radius:9px;padding:9px 13px;color:var(--ink)}
button:hover{border-color:var(--green)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary,.tabs button.active{background:var(--green);border-color:var(--green);color:white}
button.danger{color:#a52d37}
button:focus-visible,a:focus-visible{outline:3px solid #88bdf0;outline-offset:2px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cad8df;border-radius:8px;background:white;color:var(--ink)}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px}
label input,label select,label textarea{margin-top:5px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{padding:24px;border-radius:17px;background:#eaf2fc}
.card.dark{background:var(--dark);color:white}
.card.dark small{color:#c4ddd4}
.amount{font-size:35px;font-weight:750;letter-spacing:-1px;margin:10px 0}
.notice{padding:12px 16px;margin:12px 0;border-radius:10px;background:#fff3d9;color:#79571c;white-space:pre-wrap}
.error{background:#ffe9eb;color:#942d39}
.success{background:#e5f5eb;color:#256c45}
.tabs{display:flex;gap:7px;overflow:auto;padding:16px 0}
.tabs button{white-space:nowrap}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
td,th{padding:11px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.week{text-align:center;color:var(--muted);font-size:12px}
.day{min-height:92px;padding:8px 5px;text-align:left;font-size:12px;background:#f4f7fa}
.day span{display:block;overflow:hidden;text-overflow:ellipsis}
.day.selected{outline:2px solid var(--green)}
.day.outside{opacity:.4}
.day.done{background:#e7f5ed}
.day.pending{background:#fff2d7}
.day .value{font-size:11px;margin-top:7px;font-weight:bold}
.login{max-width:420px;margin:35px auto}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;background:#edf3f5;font-size:12px}
.stack>*+*{margin-top:12px}
a{color:var(--green)}
details>summary{cursor:pointer;font-weight:650}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 22px;border-radius:10px;z-index:50;max-width:90%}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
.wrap{padding:12px}
.panel{padding:14px}
.amount{font-size:30px}
.day{min-height:78px;font-size:11px}
.day .value{font-size:9px}
}
/* 星期日標題、星期日／公眾假期日期、假期名稱 */
.week.sunday,
.day.red-day .date-number,
.day .holiday-name {
  color: #c62828;
}

.day.red-day .date-number {
  font-weight: 700;
}

/* 月曆上的休假標示 */
.day .leave-name {
  color: #7c3aed;
  font-size: 11px;
  font-weight: 600;
  margin-top: 3px;
  white-space: normal;
}
/* Dashboard */
.dash-cards{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:16px;
}
.dash-cards .card{
  padding:18px;
}
.dash-cards .amount{
  font-size:25px;
  overflow-wrap:anywhere;
}
.dash-toolbar{
  margin-bottom:16px;
}
.dash-year{
  width:110px;
}
.dash-legend{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:18px;
  color:var(--muted);
  font-size:13px;
}
.dash-dot{
  display:inline-block;
  width:11px;
  height:11px;
  border-radius:3px;
  margin-right:5px;
}
.dash-dot.budget,
.dash-fill.budget{
  background:#a8c8e8;
}
.dash-dot.earned,
.dash-fill.earned{
  background:var(--green);
}
.dash-chart{
  display:grid;
  gap:13px;
}
.dash-chart-row{
  display:grid;
  grid-template-columns:56px minmax(0,1fr) 155px;
  align-items:center;
  gap:12px;
}
.dash-month{
  padding:5px;
}
.dash-tracks{
  display:grid;
  gap:5px;
}
.dash-track{
  height:10px;
  overflow:hidden;
  background:#f0f4f7;
  border-radius:20px;
}
.dash-fill{
  height:100%;
  border-radius:20px;
}
.dash-chart-value{
  text-align:right;
  font-size:13px;
}
.dash-table .number{
  text-align:right;
  font-variant-numeric:tabular-nums;
}
.dash-table tfoot{
  background:#edf5f1;
  font-weight:700;
}
.dash-current{
  background:#f0f8f4;
}
.dash-warning{
  color:#9a6700;
  font-weight:650;
}
@media(max-width:1000px){
  .dash-cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
@media(max-width:650px){
  .dash-cards .amount{
    font-size:21px;
  }
  .dash-chart-row{
    grid-template-columns:45px minmax(0,1fr) 115px;
    gap:8px;
  }
  .dash-chart-value{
    font-size:11px;
  }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <strong>Dr Ray Leung Limited</strong>
    <small> Job Management System</small>
  </div>
</header>

<div id="boot" class="wrap">
  正在啟動……
  <noscript>請啟用 JavaScript。</noscript>
</div>

<main class="wrap" x-data="incomeDashboard(incomeApp())" x-cloak>
  <div x-show="loading" class="panel">正在讀取資料……</div>
  <div x-show="err" class="notice error" role="alert">
    <span x-text="err"></span>
    <button type="button" @click="err=''">關閉</button>
  </div>
  <div x-show="ok" class="toast" role="status" x-text="ok"></div>
  <p x-show="busy" role="status">處理中，請稍候……</p>

  <fieldset :disabled="busy || loading">
    <template x-if="!session && !loading">
      <form class="panel login stack" @submit.prevent="run(()=>signIn())">
        <h2>登入</h2>
        <p class="muted">請使用公司電郵地址</p>
        <label>Email
          <input type="email" x-model="email" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" x-model="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">登入</button>
      </form>
    </template>

    <template x-if="session">
      <div>
        <div class="bar">
          <div>
            <h1 x-text="`${y} 年 ${m} 月`"></h1>
            <small x-text="session.user.email"></small>
          </div>
          <div class="actions">
            <button @click="run(()=>shift(-1))">‹ 上月</button>
            <button @click="run(()=>calToday())">今日</button>
            <button @click="run(()=>shift(1))">下月 ›</button>
            <button @click="run(()=>load())">重新讀取</button>
            <button @click="run(()=>signOut())">登出</button>
          </div>
        </div>

        <nav class="tabs" aria-label="功能">
          <template x-for="t in tabs" :key="t[0]">
            <button :class="{active:tab===t[0]}"
              :aria-pressed="tab===t[0]" @click="tab=t[0]" x-text="t[1]"></button>
          </template>
        </nav>

        <div class="notice" x-show="!attOk">
          Attendance 資料表未能讀取，暫時無法確認返工。
          請檢查原有資料表及權限；未確認收入不會自動當成已賺取。
        </div>
        
<!-- Dashboard / 收入總覽 -->
<section x-show="tab==='dash'">

  <div class="panel">
    <div class="bar dash-toolbar">
      <div>
        <h2 style="margin-bottom:4px">Dashboard／收入總覽</h2>
        <small>工作收入按工作月份；收款按實際收款日期。</small>
      </div>

      <div class="actions">
        <button type="button"
          :disabled="dashBusy"
          @click="changeDashYear(-1)">
          ‹ 上一年
        </button>

        <label>
          年份
          <input class="dash-year"
            type="number"
            min="1900"
            max="9998"
            step="1"
            x-model.number="dashYear"
            :disabled="dashBusy"
            @change="refreshDashboard()">
        </label>

        <button type="button"
          :disabled="dashBusy"
          @click="changeDashYear(1)">
          下一年 ›
        </button>

        <button type="button"
          :disabled="dashBusy"
          @click="dashYear=Number(todayDate().slice(0,4)); refreshDashboard()">
          今年
        </button>

        <button type="button"
          class="primary"
          :disabled="dashBusy"
          @click="refreshDashboard()">
          更新總覽
        </button>
      </div>
    </div>

    <p class="muted" x-show="dashUpdated && dashReady"
      x-text="'最後更新：'+dashUpdated"></p>

    <p x-show="dashBusy" role="status">正在讀取全年資料……</p>

    <div class="notice error"
      x-show="dashError"
      role="alert"
      x-text="dashError"></div>
  </div>

  <template x-if="dashReady && !dashBusy">
    <div>
      <div class="dash-cards">

        <article class="card">
          <strong>全年預計基本收入</strong>
          <div class="amount" x-text="money(dashTotal('budget'))"></div>
          <small>按排班時薪／固定金額，不包括估算分成。</small>
        </article>

        <article class="card dark">
          <strong>全年已確認收入</strong>
          <div class="amount" x-text="money(dashTotal('earned'))"></div>
          <small>已確認基本收入＋已填實際分成，包括未收款。</small>
        </article>

        <article class="card">
          <strong>全年實際收款</strong>
          <div class="amount" x-text="money(dashTotal('cash'))"></div>
          <small>按收款日期，可包括其他工作年份嘅發票。</small>
        </article>

        <article class="card">
          <strong>該工作年份已發送未收</strong>
          <div class="amount" x-text="money(dashTotal('outstanding'))"></div>
          <small>只計已發送未收款發票，不包括草稿及未開單收入。</small>
        </article>

      </div>

      <div class="notice">
        <strong>計算說明：</strong>
        「已確認收入」唔等於「收到錢」。
        分成待填時，只計已知金額，唔會用估算補上。
        <span x-show="dashTotal('pending')>0"
          x-text="' 尚有 '+dashTotal('pending')+' 筆已確認工作嘅分成資料／設定未完整。'">
        </span>
      </div>

      <div class="notice"
        x-show="dashPaymentWarnings>0"
        x-text="'有 '+dashPaymentWarnings+' 張已收款發票嘅收款日期缺漏、無效或屬未來日期，未計入收款統計。請到發票頁檢查。'">
      </div>

      <div class="panel">
        <h2 x-text="dashYear+' 年 · 每月收入比較'"></h2>

        <div class="dash-legend">
          <span><i class="dash-dot budget"></i>預計基本收入</span>
          <span><i class="dash-dot earned"></i>已確認收入</span>
        </div>

        <div class="dash-chart">
          <template x-for="r in dashRows" :key="r.month">
            <div class="dash-chart-row">

              <button type="button"
                class="dash-month"
                @click="run(()=>openDashMonth(r.month))"
                x-text="r.month+'月'"></button>

              <div class="dash-tracks" aria-hidden="true">
                <div class="dash-track">
                  <div class="dash-fill budget"
                    :style="{width:dashWidth(r.budget)}"></div>
                </div>
                <div class="dash-track">
                  <div class="dash-fill earned"
                    :style="{width:dashWidth(r.earned)}"></div>
                </div>
              </div>

              <div class="dash-chart-value">
                <strong x-text="money(r.earned)"></strong>
                <div class="muted" x-text="'預 '+money(r.budget)"></div>
              </div>

            </div>
          </template>
        </div>
      </div>

      <div class="panel scroll">
        <h2>每月明細</h2>
        <p class="muted">「待填」按日期＋診所計算，同日同診所唔會因為有兩節而重複計數。</p>

        <table class="dash-table">
          <thead>
            <tr>
              <th>工作月份</th>
              <th class="number">預計基本收入</th>
              <th class="number">已確認基本收入</th>
              <th class="number">已填實際分成</th>
              <th class="number">已確認收入</th>
              <th class="number">該月實際收款</th>
              <th class="number">該工作月已發送未收</th>
              <th class="number">分成待填</th>
              <th></th>
            </tr>
          </thead>

          <tbody>
            <template x-for="r in dashRows" :key="r.month">
              <tr :class="{'dash-current':r.prefix===todayDate().slice(0,7)}">
                <td x-text="r.month+' 月'"></td>
                <td class="number" x-text="money(r.budget)"></td>
                <td class="number" x-text="money(r.base)"></td>
                <td class="number" x-text="money(r.share)"></td>
                <td class="number">
                  <strong x-text="money(r.earned)"></strong>
                </td>
                <td class="number" x-text="money(r.cash)"></td>
                <td class="number" x-text="money(r.outstanding)"></td>
                <td class="number"
                  :class="{'dash-warning':r.pending>0}"
                  x-text="r.pending ? r.pending+' 筆' : '—'"></td>
                <td>
                  <button type="button"
                    @click="run(()=>openDashMonth(r.month))">
                    查看月份
                  </button>
                </td>
              </tr>
            </template>
          </tbody>

          <tfoot>
            <tr>
              <td>全年合計</td>
              <td class="number" x-text="money(dashTotal('budget'))"></td>
              <td class="number" x-text="money(dashTotal('base'))"></td>
              <td class="number" x-text="money(dashTotal('share'))"></td>
              <td class="number" x-text="money(dashTotal('earned'))"></td>
              <td class="number" x-text="money(dashTotal('cash'))"></td>
              <td class="number" x-text="money(dashTotal('outstanding'))"></td>
              <td class="number" x-text="dashTotal('pending')+' 筆'"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="panel">
        <h2>其他資料</h2>
        <p>
          所選工作年份嘅發票草稿：
          <strong x-text="money(dashTotal('draft'))"></strong>
          <span class="muted">（未計入已發送未收）</span>
        </p>
        <p class="muted">
          歷史工作收入按目前診所時薪、分成百分比及排班設定重新計算，
          唔係已鎖定嘅歷史帳目。修改設定或刪除舊排班，可能改變過往月份金額。
          發票及收款統計則使用已儲存嘅發票總額。
        </p>
        <p class="muted">
          預計排班亦依賴 holidays.js 嘅假期資料；
          請確保已包含所選年份，否則預計收入可能偏高。
        </p>
      </div>

    </div>
  </template>
</section>
        <!-- 收入及月曆 -->
        <section x-show="tab==='home'">
          <div class="grid">
            <article class="card">
              <strong>本月預計收入</strong>
              <div>按本月排班之工作時薪計算，未計任何佣金分成</div>
              <div class="amount" x-text="money(monthBudget())"></div>
              <small>以上金額為最底收入，不以實際收入覆蓋。</small>
            </article>
            <article class="card dark">
              <strong>本月實際總收入</strong>
              <div>按本月已確認之工作及佣金分成計算</div>
              <div class="amount" x-text="money(gross())"></div>
              <small>以上金額亦包括未收款。</small>
            </article>
          </div>
          <div class="notice">
            先在日期明細按「確認返工」，時薪方會計入實際收入。
            分成留空代表待填，不會以估算代替。診金記錄請同時填兩項；確定冇收入先填 0。
            <strong x-text="`已確認返工但分成待填：${pendingCount()} 筆`"></strong>
          </div>

          <div class="panel">
            <h2>本月更表</h2>
            <div class="calendar">
  <template x-for="w in ['日','一','二','三','四','五','六']">
    <div
      class="week"
      :class="{ sunday: w === '日' }"
      x-text="w">
    </div>
  </template>

  <template x-for="cell in cells" :key="cell.date">
    <button
      class="day"
      :class="{
        selected: calSel === cell.date,
        outside: !cell.inMonth,
        done: cell.mark === 'yes',
        pending: cell.entries.some(e => confirmed(e) && needsLog(e)),
        'red-day': !!cell.holiday ||
          new Date(cell.date + 'T12:00:00').getDay() === 0
      }"
      :aria-label="cell.date"
      @click="run(() => selectDay(cell.date))">

      <span
        class="date-number"
        x-text="cell.day + (cell.isToday ? ' · 今日' : '')">
      </span>

      <span
        x-text="cell.entries.map(e => e.code).join(' / ')">
      </span>

   <!-- 公眾假期名稱 -->
<span
  class="holiday-name"
  x-text="cell.holiday">
</span>

<!-- 自己落的休假 -->
<span
  class="leave-name"
  x-show="leaveLabel(cell.date)"
  x-text="leaveLabel(cell.date)">
</span>

<!-- 收入金額：保留原有邏輯 -->
<span
  class="value"
  x-text="cell.entries.some(e => confirmed(e))
    ? money(cell.entries.reduce((n,e) => n + entryEarned(e), 0))
    : cell.entries.length ? '預 ' + money(cell.budget) : ''">
</span>
              </button>
            </template>
          </div>
          </div>

          <div class="panel">
            <h2 x-text="calSel+' · 日期明細'"></h2>
            <template x-if="selCell()">
              <div>
                <p class="muted" x-show="!selCell().entries.length">沒有可用排班。</p>
                <template x-for="e in selCell().entries" :key="e.clinic_id">
                  <div class="panel">
                    <div class="bar">
                      <strong x-text="e.name"></strong>
                      <span class="badge"
                        x-text="e.off?'已取消':confirmed(e)?'已確認返工':'未確認返工'"></span>
                    </div>
                    <p x-text="`${e.hours} 小時 · 時薪／固定金額 ${money(e.base)}`"></p>
                    <p x-text="'已確認收入：'+money(entryEarned(e))+(confirmed(e)&&needsLog(e)?'（分成待填）':'')"></p>
                    <div class="actions">
                      <button class="primary"
                        :disabled="!attOk || e.off || e.date>todayDate()"
                        @click="run(()=>toggleWork(e))"
                        x-text="e.worked?'撤回返工確認':'確認返工'"></button>
                      <button @click="editLog(e.date,e.clinic_id)">填診金／小手術</button>
                      <button x-show="!e.off" @click="run(()=>markOff(e))">取消固定更</button>
                      <button x-show="e.offIds.length" @click="run(()=>undoOff(e))">復原取消</button>
                    </div>
                  </div>
                </template>
                <template x-for="(s,i) in selCell().other" :key="i">
                  <p class="muted" x-text="cl(s.clinic_id)+' · '+blk(s.block)+' · '+s.reason"></p>
                </template>
              </div>
            </template>
          </div>
        </section>

        <!-- 每日記錄 -->
        <section x-show="tab==='rec'">
          <form class="panel stack" @submit.prevent="run(()=>saveDaily())">
            <h2>每日診金記錄</h2>
            <p class="muted">
              填診所診金／小手術總額，系統按診所百分比計你嘅分成。
              儲存記錄不等於確認返工。
            </p>
            <div class="formgrid">
              <label>日期

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./holidays.js"></script>

<script src="./calc2.js"></script>
<script src="./invoice.js"></script>

<script>
function incomeApp(){
  const original=app();
  return {
    ...original,
    busy:false,
    tabs:[
      ['home','收入／月曆'],
      ['rec','每日診金'],
      ['clinics','診所'],
      ['rules','固定更'],
      ['adjust','休假／加班'],
      ['inv','發票'],
      ['settings','個人設定']
    ],
    profileFields:[
      ['full_name','姓名／開單人名稱'],
      ['reg_no','註冊編號'],
      ['phone','電話'],
      ['email','Email'],
      ['bank_name','銀行'],
      ['account_name','戶口持有人'],
      ['account_no','銀行戶口號碼'],
      ['fps_id','FPS']
    ],
    logForm:{
      date:Calc2.today(),clinic_id:'',consult:'',proc:''
    },

    async init(){
      document.getElementById('boot').style.display='none';
      try{
        await original.init.call(this);
      }catch(e){
        this.fail(e);
      }finally{
        this.loading=false;
      }
    },

    async run(fn){
      if(this.busy)return;
      this.busy=true;
      this.err='';
      try{
        return await fn();
      }catch(e){
        return this.fail(e);
      }finally{
        this.busy=false;
      }
    },

    money(value){
      return 'HK$ '+Number(value||0).toLocaleString('en-HK',{
        minimumFractionDigits:2,maximumFractionDigits:2
      });
    },

    todayDate(){return Calc2.today()},
    leaveLabel(date){
  return (this.leaves || [])
    .filter(l =>
      l.start_date &&
      date >= l.start_date &&
      date <= (l.end_date || l.start_date)
    )
    .map(l => {
      const period =
        l.period === 'am' ? '上午休假' :
        l.period === 'pm' ? '下午休假' :
        '全日休假';

      const reason = (l.reason || '').trim();

      return reason ? `${period} · ${reason}` : period;
    })
    .join(' / ');
},
    monthPrefix(){return `${this.y}-${String(this.m).padStart(2,'0')}-`},
    monthEntries(){
      return this.cells.filter(c=>c.inMonth).flatMap(c=>c.entries);
    },
    monthBudget(){
      return this.cells.filter(c=>c.inMonth).reduce((n,c)=>n+c.budget,0);
    },
    confirmed(e){
      return !e.off && e.worked && e.date<=this.todayDate();
    },
    needsLog(e){
      const c=this.clinicOf(e.clinic_id);
      return e.regular && (
        c.procedure_pct==null ||
        ((Number(c.consult_pct)>0||Number(c.procedure_pct)>0)&&!e.log)
      );
    },
    entryEarned(e){
      if(!this.confirmed(e))return 0;
      const l=this.logs.find(l=>l.date===e.date&&l.clinic_id===e.clinic_id);
      const c=this.clinicOf(e.clinic_id);
      return e.base+(l?this._share(c,l.consult_total,l.procedure_total):0);
    },
    gross(){
      const before=this.todayDate();
      const worked=new Set(this.att.filter(a=>a.date<=before)
        .map(a=>a.date+'|'+a.clinic_id));
      let value=this.result.sessions.reduce((n,s)=>
        n+(worked.has(s.date+'|'+s.clinic_id)?Number(s.base)||0:0),0);
      for(const l of this.monthLogs()){
        if(worked.has(l.date+'|'+l.clinic_id)){
          value+=this._share(this.clinicOf(l.clinic_id),l.consult_total,l.procedure_total);
        }
      }
      return value;
    },
    pendingCount(){
      return this.monthEntries().filter(e=>this.confirmed(e)&&this.needsLog(e)).length;
    },

    editLog(date,clinic_id){
      this.logForm={date,clinic_id,consult:'',proc:''};
      this.fillLog();
      this.tab='rec';
      window.scrollTo({top:0,behavior:'smooth'});
    },
    fillLog(){
      const l=this.logs.find(l=>l.date===this.logForm.date&&
        l.clinic_id===this.logForm.clinic_id);
      this.logForm.consult=l?.consult_total??'';
      this.logForm.proc=l?.procedure_total??'';
    },
    async saveDaily(){
      const f=this.logForm;
      if(!f.clinic_id||!f.date||f.date>this.todayDate()){
        return this.fail('請選擇診所及有效日期，不能填未來實際收入。');
      }
      const valid=v=>v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>=0;
      if(!valid(f.consult)||!valid(f.proc)){
        return this.fail('兩項都要填寫；確定冇收入先填 0。');
      }
      const [year,month]=f.date.split('-').map(Number);
      if(this.invoices.some(i=>i.clinic_id===f.clinic_id&&i.year===year&&i.month===month)){
        return this.fail('此診所月份已有發票。為免單據與收入不一致，不能直接修改；草稿可先刪除再重建。');
      }
      const {error}=await db.from('daily_logs').upsert({
        clinic_id:f.clinic_id,date:f.date,
        consult_total:Number(f.consult),
        procedure_total:Number(f.proc)
      },{onConflict:'clinic_id,date'});
      if(error)return this.fail(error);
      const difference=(year-this.y)*12+month-this.m;
      if(difference)await this.shift(difference);
      else await this.load();
      if(this.err)return;
      this.fillLog();
      this.flash('診金記錄已儲存');
    },

    async saveRule(){
      if(Calc.hoursOf(this.ruleForm)<=0){
        return this.fail('結束時間必須遲於開始時間；跨夜更請拆開輸入。');
      }
      return await original.addRule.call(this);
    },
    async saveExtraChecked(){
      const f=this.extraForm;
      if(Number(f.hours)<0 ||
         (f.fixed_amount!==''&&Number(f.fixed_amount)<0)){
        return this.fail('時數及金額不能為負數。');
      }
      return await original.addExtra.call(this);
    },

    async invoiceChecked(row){
      const c=row.clinic;
      if(this.invOf(c.id))return this.fail('此診所本月已有發票。');
      if(!this.issueDate)return this.fail('請填發出日期。');
      if(!this.attOk)return this.fail('無法讀取返工確認，暫時不能開單。');
      if(c.procedure_pct==null){
        return this.fail('請先在診所設定填小手術分成百分比；沒有分成請填 0。');
      }
      const sessions=this.result.sessions.filter(s=>s.clinic_id===c.id);
      const logs=this.monthLogs().filter(l=>l.clinic_id===c.id);
      const dates=new Set([...sessions.map(s=>s.date),...logs.map(l=>l.date)]);
      if(!dates.size)return this.fail('本月沒有可開單記錄。');
      for(const date of dates){
        if(date>this.todayDate()){
          return this.fail('本月仍有未來排班，尚未能產生全月發票。');
        }
        if(!this.att.some(a=>a.clinic_id===c.id&&a.date===date)){
          return this.fail(`${date} 尚未確認返工，請先到月曆確認。`);
        }
      }
      const requiresShare=Number(c.consult_pct)>0||Number(c.procedure_pct)>0;
      if(requiresShare){
        const missing=sessions.find(s=>s.kind!=='special'&&
          !logs.some(l=>l.date===s.date));
        if(missing)return this.fail(`${missing.date} 分成待填，暫時不能開單。`);
      }
      const inv=Calc2.buildInvoice(
        c,this.y,this.m,this.result.sessions,this.logs,this.issueDate
      );
      if(!Number.isFinite(inv.total)||inv.total<0){
        return this.fail('發票金額無效，請檢查設定。');
      }
      if(!confirm(`產生 ${c.name} Invoice，合共 ${this.money(inv.total)}？`))return;
      return await this.add('invoices',{
        clinic_id:c.id,year:this.y,month:this.m,
        invoice_no:inv.invoice_no,issue_date:inv.issue_date,
        due_date:inv.due_date,total:inv.total,snapshot:inv.snapshot
      });
    },
    async reopenInvoice(inv){
      if(!confirm('確認改回未收款？實際收入不會因此改變。'))return;
      return await this.setStatus(inv,'sent');
    }
  };
