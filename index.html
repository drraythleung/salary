<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173e37">
<title>診金預算及 Invoice 管理</title>
<style>
/* 純 UI 微調：不改動資料及功能 */
:root {
  --bg: #f5f7f9;
  --ink: #21332f;
  --muted: #73817d;
  --line: #e5ebe8;
  --green: #237563;
  --dark: #183f36;
}

body {
  -webkit-font-smoothing: antialiased;
}

header {
  background: #fff;
  border-bottom-color: var(--line);
}

header strong {
  font-size: 16px;
  letter-spacing: .3px;
}

.wrap {
  max-width: 1180px;
  padding: 22px;
}

main.wrap {
  padding-top: 28px;
  padding-bottom: 64px;
}

h1 {
  font-size: 28px;
  letter-spacing: -.7px;
}

h2 {
  letter-spacing: -.3px;
}

button {
  min-height: 42px;
  border-color: #dce5e0;
  border-radius: 10px;
  font-weight: 550;
  transition: background .15s, border-color .15s, box-shadow .15s;
}

button:hover:not(:disabled) {
  background: #f0f6f3;
  border-color: #a8c5b9;
}

button.primary {
  box-shadow: 0 3px 8px rgb(35 117 99 / 12%);
}

button.primary:hover:not(:disabled) {
  background: #1b6252;
  border-color: #1b6252;
}

button.danger:hover:not(:disabled) {
  background: #fff0f1;
  border-color: #e7bdc1;
}

.tabs {
  gap: 8px;
  padding: 22px 0;
}

.tabs button {
  flex-shrink: 0;
  padding: 10px 16px;
  background: transparent;
  border-color: transparent;
  color: #61736c;
}

.tabs button.active,
.tabs button.active:hover {
  background: var(--green);
  border-color: var(--green);
  color: white;
  box-shadow: 0 4px 10px rgb(35 117 99 / 14%);
}

.grid {
  gap: 18px;
  margin-bottom: 18px;
}

.card {
  padding: 26px;
  border: 1px solid #dce7ef;
  border-radius: 20px;
  background: #edf3f8;
}

.card > strong {
  display: block;
  margin-bottom: 5px;
  font-size: 12px;
  letter-spacing: .7px;
}

.card > div:not(.amount) {
  font-weight: 600;
}

.card.dark {
  background: var(--dark);
  border-color: var(--dark);
  box-shadow: 0 8px 20px rgb(24 63 54 / 12%);
}

.amount {
  margin: 14px 0;
  font-size: clamp(28px, 3.5vw, 40px);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.panel {
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 3px 14px rgb(29 53 43 / 3%);
}

.panel .panel {
  padding: 16px;
  border-radius: 12px;
  box-shadow: none;
}

.panel .panel:last-child {
  margin-bottom: 0;
}

.notice {
  margin: 16px 0;
  padding: 14px 17px;
  border: 1px solid #f0e2bf;
  border-radius: 12px;
  background: #fff8e9;
  font-size: 13px;
  line-height: 1.8;
}

.notice.error {
  background: #fff0f1;
  border-color: #f0d1d5;
  color: #942d39;
}

label {
  color: #53675e;
  font-weight: 550;
}

input,
select,
textarea {
  min-height: 44px;
  border-color: #dbe4df;
  border-radius: 10px;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #a3c9bb;
  outline-offset: 2px;
  border-color: var(--green);
}

input[type="checkbox"] {
  min-height: auto;
  accent-color: var(--green);
}

textarea {
  min-height: 88px;
  resize: vertical;
}

.calendar {
  gap: 7px;
}

.week {
  padding: 5px 0 10px;
  font-weight: 600;
}

.day {
  min-height: 102px;
  padding: 10px 8px;
  border: 1px solid #e9eeeb;
  border-radius: 12px;
  background: #f7f9f8;
}

.day > span:first-child {
  font-weight: 650;
}

.day.done,
.day.done:hover:not(:disabled) {
  background: #eaf5ee;
  border-color: #d5e8dc;
}

.day.pending,
.day.pending:hover:not(:disabled) {
  background: #fff4df;
  border-color: #efdfba;
}

.day.selected {
  outline: 2px solid var(--green);
  outline-offset: 1px;
}

.day .value {
  margin-top: 9px;
  font-variant-numeric: tabular-nums;
}

th {
  background: #f7f9f8;
  font-weight: 600;
}

td,
th {
  padding: 13px 12px;
}

tbody tr:hover {
  background: #fafcfb;
}

.badge {
  padding: 4px 9px;
  border-radius: 7px;
  background: #eef4f0;
  color: #496859;
}

.toast {
  bottom: 24px;
  box-shadow: 0 8px 28px rgb(24 63 54 / 20%);
}

@media (max-width: 650px) {
  .wrap {
    padding: 14px;
  }

  main.wrap {
    padding-top: 20px;
    padding-bottom: 40px;
  }

  header .wrap {
    gap: 4px;
  }

  header strong {
    font-size: 14px;
  }

  h1 {
    font-size: 25px;
  }

  .bar {
    gap: 12px;
  }

  .actions {
    gap: 7px;
  }

  .actions button {
    padding: 9px 11px;
    font-size: 13px;
  }

  .tabs {
    padding: 16px 0;
  }

  .tabs button {
    padding: 9px 13px;
    font-size: 13px;
  }

  .grid {
    gap: 12px;
  }

  .card {
    padding: 22px;
    border-radius: 16px;
  }

  .panel {
    padding: 16px;
    border-radius: 15px;
  }

  .calendar {
    gap: 4px;
  }

  .day {
    min-height: 86px;
    padding: 8px 4px;
    border-radius: 8px;
    font-size: 11px;
  }

  .day .value {
    font-size: 9px;
    letter-spacing: -.3px;
  }

  input,
  select,
  textarea {
    font-size: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  button {
    transition: none;
  }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <strong>＋ 診金預算及 Invoice 管理</strong>
    <small>Supabase 雲端版</small>
  </div>
</header>

<div id="boot" class="wrap">
  正在啟動……
  <noscript>請啟用 JavaScript。</noscript>
</div>

<main class="wrap" x-data="incomeApp()" x-cloak>
  <div x-show="loading" class="panel">正在讀取資料……</div>
  <div x-show="err" class="notice error" role="alert">
    <span x-text="err"></span>
    <button type="button" @click="err=''">關閉</button>
  </div>
  <div x-show="ok" class="toast" role="status" x-text="ok"></div>
  <p x-show="busy" role="status">處理中，請稍候……</p>

  <fieldset :disabled="busy || loading">
    <template x-if="!session && !loading">
      <form class="panel login stack" @submit.prevent="run(()=>signIn())">
        <h2>登入</h2>
        <p class="muted">使用原有 Supabase 帳戶。</p>
        <label>Email
          <input type="email" x-model="email" autocomplete="username" required>
        </label>
        <label>Password
          <input type="password" x-model="password" autocomplete="current-password" required>
        </label>
        <button class="primary" type="submit">登入</button>
      </form>
    </template>

    <template x-if="session">
      <div>
        <div class="bar">
          <div>
            <h1 x-text="`${y} 年 ${m} 月`"></h1>
            <small x-text="session.user.email"></small>
          </div>
          <div class="actions">
            <button @click="run(()=>shift(-1))">‹ 上月</button>
            <button @click="run(()=>calToday())">今日</button>
            <button @click="run(()=>shift(1))">下月 ›</button>
            <button @click="run(()=>load())">重新讀取</button>
            <button @click="run(()=>signOut())">登出</button>
          </div>
        </div>

        <nav class="tabs" aria-label="功能">
          <template x-for="t in tabs" :key="t[0]">
            <button :class="{active:tab===t[0]}"
              :aria-pressed="tab===t[0]" @click="tab=t[0]" x-text="t[1]"></button>
          </template>
        </nav>

        <div class="notice" x-show="!attOk">
          attendance 資料表未能讀取，暫時無法確認返工。
          請檢查原有資料表及權限；未確認收入不會自動當成已賺取。
        </div>

        <!-- 收入及月曆 -->
        <section x-show="tab==='home'">
          <div class="grid">
            <article class="card">
              <strong>Estimated Income</strong>
              <div>本月預計收入</div>
              <div class="amount" x-text="money(monthBudget())"></div>
              <small>全月排班時薪／固定金額＋估算分成；不以實際分成覆蓋。</small>
            </article>
            <article class="card dark">
              <strong>Real Gross Income</strong>
              <div>本月實際總收入 · 已確認部分</div>
              <div class="amount" x-text="money(gross())"></div>
              <small>只計已確認返工及已知金額，未扣開支，包括未收款。</small>
            </article>
          </div>
          <div class="notice">
            先在日期明細按「確認返工」，時薪／固定金額先會計入實際收入。
            分成留空代表待填，不會以估算代替。診金記錄請同時填兩項；確定冇收入先填 0。
            <br>
            <strong x-text="`已確認返工但分成待填：${pendingCount()} 筆`"></strong>
          </div>

          <div class="panel">
            <h2>本月更表</h2>
            <div class="calendar">
              <template x-for="w in ['日','一','二','三','四','五','六']">
                <div class="week" x-text="w"></div>
              </template>
              <template x-for="cell in cells" :key="cell.date">
                <button class="day"
                  :class="{
                    selected:calSel===cell.date,
                    outside:!cell.inMonth,
                    done:cell.mark==='yes',
                    pending:cell.entries.some(e=>confirmed(e)&&needsLog(e))
                  }"
                  :aria-label="cell.date"
                  @click="run(()=>selectDay(cell.date))">
                  <span x-text="cell.day+(cell.isToday?' · 今日':'')"></span>
                  <span x-text="cell.entries.map(e=>e.code).join(' / ')"></span>
                  <span x-text="cell.holiday"></span>
                  <span class="value"
                    x-text="cell.entries.some(e=>confirmed(e))
                      ? money(cell.entries.reduce((n,e)=>n+entryEarned(e),0))
                      : cell.entries.length ? '預 '+money(cell.budget) : ''"></span>
                </button>
              </template>
            </div>
          </div>

          <div class="panel">
            <h2 x-text="calSel+' · 日期明細'"></h2>
            <template x-if="selCell()">
              <div>
                <p class="muted" x-show="!selCell().entries.length">沒有可用排班。</p>
                <template x-for="e in selCell().entries" :key="e.clinic_id">
                  <div class="panel">
                    <div class="bar">
                      <strong x-text="e.name"></strong>
                      <span class="badge"
                        x-text="e.off?'已取消':confirmed(e)?'已確認返工':'未確認返工'"></span>
                    </div>
                    <p x-text="`${e.hours} 小時 · 時薪／固定金額 ${money(e.base)}`"></p>
                    <p x-text="'已確認收入：'+money(entryEarned(e))+(confirmed(e)&&needsLog(e)?'（分成待填）':'')"></p>
                    <div class="actions">
                      <button class="primary"
                        :disabled="!attOk || e.off || e.date>todayDate()"
                        @click="run(()=>toggleWork(e))"
                        x-text="e.worked?'撤回返工確認':'確認返工'"></button>
                      <button @click="editLog(e.date,e.clinic_id)">填診金／小手術</button>
                      <button x-show="!e.off" @click="run(()=>markOff(e))">取消固定更</button>
                      <button x-show="e.offIds.length" @click="run(()=>undoOff(e))">復原取消</button>
                    </div>
                  </div>
                </template>
                <template x-for="(s,i) in selCell().other" :key="i">
                  <p class="muted" x-text="cl(s.clinic_id)+' · '+blk(s.block)+' · '+s.reason"></p>
                </template>
              </div>
            </template>
          </div>
        </section>

        <!-- 每日記錄 -->
        <section x-show="tab==='rec'">
          <form class="panel stack" @submit.prevent="run(()=>saveDaily())">
            <h2>每日診金記錄</h2>
            <p class="muted">
              填診所診金／小手術總額，系統按診所百分比計你嘅分成。
              儲存記錄不等於確認返工。
            </p>
            <div class="formgrid">
              <label>日期
                <input type="date" x-model="logForm.date"
                  @change="fillLog()" :max="todayDate()" required>
              </label>
              <label>診所
                <select x-model="logForm.clinic_id" @change="fillLog()" required>
                  <option value="">請選擇</option>
                  <template x-for="c in clinics" :key="c.id">
                    <option :value="c.id" x-text="c.name"></option>
                  </template>
                </select>
              </label>
              <label>診金總額 HK$
                <input type="number" min="0" step=".01"
                  x-model="logForm.consult" placeholder="待填；確定冇收入先填 0" required>
              </label>
              <label>小手術總額 HK$
                <input type="number" min="0" step=".01"
                  x-model="logForm.proc" placeholder="待填；確定冇收入先填 0" required>
              </label>
            </div>
            <button class="primary" type="submit">儲存兩項記錄</button>
          </form>
          <div class="panel scroll">
            <h2>本月記錄</h2>
            <table>
              <thead><tr><th>日期</th><th>診所</th><th>診金</th><th>小手術</th><th></th></tr></thead>
              <tbody>
                <template x-for="l in monthLogs()" :key="l.id">
                  <tr>
                    <td x-text="l.date"></td><td x-text="cl(l.clinic_id)"></td>
                    <td x-text="money(l.consult_total)"></td>
                    <td x-text="money(l.procedure_total)"></td>
                    <td><button @click="editLog(l.date,l.clinic_id)">修改</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 診所 -->
        <section x-show="tab==='clinics'">
          <form class="panel stack" @submit.prevent="run(()=>addClinic())">
            <h2>新增診所</h2>
            <div class="formgrid">
              <label>代號<input x-model="newClinic.code" required></label>
              <label>名稱<input x-model="newClinic.name" required></label>
              <label>時薪<input type="number" min="0" step=".01" x-model="newClinic.hourly_rate" required></label>
            </div>
            <button class="primary">新增診所</button>
          </form>
          <template x-for="c in clinics" :key="c.id">
            <form class="panel stack" @submit.prevent="run(()=>saveClinic(c))">
              <h2 x-text="c.code+' · '+c.name"></h2>
              <div class="formgrid">
                <label>代號<input x-model="c.code" required></label>
                <label>名稱<input x-model="c.name" required></label>
                <label>時薪<input type="number" min="0" step=".01" x-model="c.hourly_rate" required></label>
                <label>診金分成 %<input type="number" min="0" max="100" step=".01" x-model="c.consult_pct" required></label>
                <label>小手術分成 %（冇分成填 0）<input type="number" min="0" max="100" step=".01" x-model="c.procedure_pct" required></label>
                <label>每日估算診金<input type="number" min="0" step=".01" x-model="c.est_consult_per_day"></label>
                <label>每日估算小手術<input type="number" min="0" step=".01" x-model="c.est_procedure_per_day"></label>
                <label>付款期限（日）<input type="number" min="1" step="1" x-model="c.payment_terms_days" required></label>
                <label>Invoice 抬頭<input x-model="c.bill_name"></label>
                <label>帳單地址<input x-model="c.bill_address"></label>
                <label>聯絡人<input x-model="c.contact_name"></label>
                <label>聯絡 Email<input type="email" x-model="c.contact_email"></label>
                <label>WhatsApp<input x-model="c.contact_whatsapp"></label>
              </div>
              <label><input type="checkbox" x-model="c.active"> 啟用固定更</label>
              <button class="primary">儲存診所設定</button>
            </form>
          </template>
        </section>

        <!-- 固定更 -->
        <section x-show="tab==='rules'">
          <form class="panel stack" @submit.prevent="run(()=>saveRule())">
            <h2>新增固定更</h2>
            <div class="formgrid">
              <label>診所
                <select x-model="ruleForm.clinic_id" required>
                  <option value="">請選擇</option>
                  <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
                </select>
              </label>
              <label>星期
                <select x-model.number="ruleForm.weekday">
                  <template x-for="(w,i) in ['日','一','二','三','四','五','六']">
                    <option :value="i" x-text="'星期'+w"></option>
                  </template>
                </select>
              </label>
              <label>時段<select x-model="ruleForm.block"><option value="am">上午</option><option value="pm">下午</option></select></label>
              <label>開始<input type="time" x-model="ruleForm.start_time" required></label>
              <label>結束<input type="time" x-model="ruleForm.end_time" required></label>
            </div>
            <p class="muted">此表單沿用原有固定更欄位；新增後按星期重複。</p>
            <button class="primary">新增固定更</button>
          </form>
          <div class="panel scroll">
            <table>
              <thead><tr><th>診所</th><th>星期／時段</th><th>時間</th><th>生效範圍</th><th></th></tr></thead>
              <tbody>
                <template x-for="r in rules" :key="r.id">
                  <tr>
                    <td x-text="cl(r.clinic_id)"></td>
                    <td x-text="'星期'+wk(r.weekday)+' '+blk(r.block)"></td>
                    <td x-text="hm(r.start_time)+'–'+hm(r.end_time)"></td>
                    <td x-text="(r.valid_from||'不限')+' → '+(r.valid_to||'不限')"></td>
                    <td><button class="danger" @click="run(()=>del('schedule_rules',r.id))">刪除</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </section>

        <!-- 休假、加節、調整 -->
        <section x-show="tab==='adjust'">
          <form class="panel stack" @submit.prevent="run(()=>addLeave())">
            <h2>休假</h2>
            <div class="formgrid">
              <label>開始日期<input type="date" x-model="leaveForm.start_date" required></label>
              <label>結束日期<input type="date" x-model="leaveForm.end_date"></label>
              <label>時段<select x-model="leaveForm.period"><option value="full">全日</option><option value="am">上午</option><option value="pm">下午</option></select></label>
              <label>原因<input x-model="leaveForm.reason"></label>
            </div>
            <button class="primary">新增休假</button>
            <template x-for="l in leaves" :key="l.id">
              <div class="bar">
                <span x-text="`${l.start_date} → ${l.end_date} · ${l.period==='full'?'全日':blk(l.period)} · ${l.reason||''}`"></span>
                <button type="button" class="danger" @click="run(()=>del('leaves',l.id))">刪除</button>
              </div>
            </template>
          </form>

          <form class="panel stack" @submit.prevent="run(()=>saveExtraChecked())">
            <h2>加節／固定金額特更</h2>
            <div class="formgrid">
              <label>診所<select x-model="extraForm.clinic_id" required>
                <option value="">請選擇</option>
                <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
              </select></label>
              <label>日期<input type="date" x-model="extraForm.date" required></label>
              <label>時數<input type="number" min="0" step=".25" x-model="extraForm.hours"></label>
              <label>固定金額（普通加節留空）<input type="number" min="0" step=".01" x-model="extraForm.fixed_amount"></label>
              <label>備註<input x-model="extraForm.note"></label>
            </div>
            <button class="primary">新增加節</button>
            <template x-for="e in extras.filter(e=>e.date.startsWith(monthPrefix()))" :key="e.id">
              <div class="bar">
                <span x-text="`${e.date} · ${cl(e.clinic_id)} · ${e.fixed_amount==null?e.hours+' 小時':money(e.fixed_amount)}`"></span>
                <button type="button" class="danger" @click="run(()=>del('extra_sessions',e.id))">刪除</button>
              </div>
            </template>
          </form>

          <form class="panel stack" @submit.prevent="run(()=>addOverride())">
            <h2>固定更調整</h2>
            <p class="muted">「返工」可恢復假日固定更；不會憑空新增排班。另加工作請用上方「加節」。</p>
            <div class="formgrid">
              <label>日期<input type="date" x-model="ovForm.date" required></label>
              <label>診所<select x-model="ovForm.clinic_id">
                <option value="">全部診所</option>
                <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
              </select></label>
              <label>時段<select x-model="ovForm.block"><option value="all">全日</option><option value="am">上午</option><option value="pm">下午</option></select></label>
              <label>操作<select x-model="ovForm.action"><option value="work">返工</option><option value="cancel">取消</option></select></label>
              <label>每節替代時數（可留空）<input type="number" min="0" step=".25" x-model="ovForm.hours"></label>
              <label>備註<input x-model="ovForm.note"></label>
            </div>
            <button class="primary">儲存調整</button>
            <template x-for="o in overrides.filter(o=>o.date.startsWith(monthPrefix()))" :key="o.id">
              <div class="bar">
                <span x-text="`${o.date} · ${o.clinic_id?cl(o.clinic_id):'全部診所'} · ${blk(o.block)} · ${o.action==='cancel'?'取消':'返工'}`"></span>
                <button type="button" class="danger" @click="run(()=>del('overrides',o.id))">刪除調整</button>
              </div>
            </template>
          </form>
        </section>

        <!-- Invoice -->
        <section x-show="tab==='inv'">
          <div class="panel stack">
            <h2>按診所產生本月 Invoice</h2>
            <label>發出日期<input type="date" x-model="issueDate" required></label>
            <p class="muted">此版保留原有「每診所每月一張」格式。全部工作須已確認、所需分成已填，才可開單；不用估算金額開單。</p>
            <template x-for="item in invRows()" :key="item.r.clinic.id">
              <div class="bar">
                <span x-text="item.r.clinic.name"></span>
                <button class="primary" :disabled="!!item.inv"
                  @click="run(()=>invoiceChecked(item.r))"
                  x-text="item.inv?'本月已開單':'檢查並產生 Invoice'"></button>
              </div>
            </template>
          </div>
          <div class="panel">
            <h2>本月 Invoice</h2>
            <template x-for="i in invoices.filter(i=>i.year===y&&i.month===m)" :key="i.id">
              <div class="panel stack">
                <div class="bar">
                  <strong x-text="i.invoice_no"></strong>
                  <strong x-text="money(i.total)"></strong>
                </div>
                <p x-text="`${cl(i.clinic_id)} · 到期 ${i.due_date} · ${isOverdue(i)?'已逾期 '+overdueDays(i)+' 日':statusLabel(i)}`"></p>
                <div class="actions">
                  <button @click="printInv(i)">列印／另存 PDF</button>
                  <button x-show="i.status==='draft'" @click="run(()=>setStatus(i,'sent'))">標記已發送</button>
                  <button class="primary" x-show="i.status!=='paid'" @click="run(()=>setStatus(i,'paid'))">標記已收款</button>
                  <button x-show="i.status==='paid'" @click="run(()=>reopenInvoice(i))">改回未收款</button>
                  <button @click="run(()=>copyText(remindText(i)))">複製付款提醒</button>
                  <button class="danger" x-show="i.status==='draft'"
                    @click="run(()=>del('invoices',i.id))">刪除草稿</button>
                </div>
              </div>
            </template>
          </div>
          <div class="panel">
            <h2>所有月份逾期未收</h2>
            <template x-for="i in overdueList()" :key="i.id">
              <div class="bar">
                <span x-text="i.invoice_no+' · '+money(i.total)+' · 逾期 '+overdueDays(i)+' 日'"></span>
                <button @click="printInv(i)">查看／列印</button>
              </div>
            </template>
          </div>
        </section>

        <!-- 個人資料 -->
        <section x-show="tab==='settings'">
          <form class="panel stack" @submit.prevent="run(()=>saveProfile())">
            <h2>個人及收款資料</h2>
            <div class="formgrid">
              <template x-for="f in profileFields" :key="f[0]">
                <label><span x-text="f[1]"></span><input x-model="profile[f[0]]"></label>
              </template>
            </div>
            <label>地址<textarea x-model="profile.address"></textarea></label>
            <label>Invoice 頁尾備註<textarea x-model="profile.footer_note"></textarea></label>
            <label>簽名圖片<input type="file" accept="image/*" @change="pickSignature($event)"></label>
            <template x-if="profile.signature">
              <img :src="profile.signature" alt="簽名預覽" style="max-width:220px;max-height:90px">
            </template>
            <button class="primary">儲存設定</button>
          </form>
        </section>
      </div>
    </template>
  </fieldset>
</main>

<script>
window.addEventListener('error', function(event){
  const box=document.getElementById('boot');
  if(box){
    box.style.display='block';
    box.textContent='啟動／程式錯誤：'+
      (event.message || '有檔案未能載入，請確認 HTML 與原有 JS 位於同一目錄。');
  }
},true);
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<script src="./holidays.js"></script>
<script src="./calc.js"></script>
<script src="./calc2.js"></script>
<script src="./invoice.js"></script>
<script src="./app.js"></script>

<script>
function incomeApp(){
  const original=app();
  return {
    ...original,
    busy:false,
    tabs:[
      ['home','收入／月曆'],
      ['rec','每日診金'],
      ['clinics','診所'],
      ['rules','固定更'],
      ['adjust','休假／加節'],
      ['inv','Invoice'],
      ['settings','個人設定']
    ],
    profileFields:[
      ['full_name','姓名／開單人名稱'],
      ['reg_no','註冊編號'],
      ['phone','電話'],
      ['email','Email'],
      ['bank_name','銀行'],
      ['account_name','戶口持有人'],
      ['account_no','銀行戶口號碼'],
      ['fps_id','FPS']
    ],
    logForm:{
      date:Calc2.today(),clinic_id:'',consult:'',proc:''
    },

    async init(){
      document.getElementById('boot').style.display='none';
      try{
        await original.init.call(this);
      }catch(e){
        this.fail(e);
      }finally{
        this.loading=false;
      }
    },

    async run(fn){
      if(this.busy)return;
      this.busy=true;
      this.err='';
      try{
        return await fn();
      }catch(e){
        return this.fail(e);
      }finally{
        this.busy=false;
      }
    },

    money(value){
      return 'HK$ '+Number(value||0).toLocaleString('en-HK',{
        minimumFractionDigits:2,maximumFractionDigits:2
      });
    },

    todayDate(){return Calc2.today()},
    monthPrefix(){return `${this.y}-${String(this.m).padStart(2,'0')}-`},
    monthEntries(){
      return this.cells.filter(c=>c.inMonth).flatMap(c=>c.entries);
    },
    monthBudget(){
      return this.cells.filter(c=>c.inMonth).reduce((n,c)=>n+c.budget,0);
    },
    confirmed(e){
      return !e.off && e.worked && e.date<=this.todayDate();
    },
    needsLog(e){
      const c=this.clinicOf(e.clinic_id);
      return e.regular && (
        c.procedure_pct==null ||
        ((Number(c.consult_pct)>0||Number(c.procedure_pct)>0)&&!e.log)
      );
    },
    entryEarned(e){
      if(!this.confirmed(e))return 0;
      const l=this.logs.find(l=>l.date===e.date&&l.clinic_id===e.clinic_id);
      const c=this.clinicOf(e.clinic_id);
      return e.base+(l?this._share(c,l.consult_total,l.procedure_total):0);
    },
    gross(){
      const before=this.todayDate();
      const worked=new Set(this.att.filter(a=>a.date<=before)
        .map(a=>a.date+'|'+a.clinic_id));
      let value=this.result.sessions.reduce((n,s)=>
        n+(worked.has(s.date+'|'+s.clinic_id)?Number(s.base)||0:0),0);
      for(const l of this.monthLogs()){
        if(worked.has(l.date+'|'+l.clinic_id)){
          value+=this._share(this.clinicOf(l.clinic_id),l.consult_total,l.procedure_total);
        }
      }
      return value;
    },
    pendingCount(){
      return this.monthEntries().filter(e=>this.confirmed(e)&&this.needsLog(e)).length;
    },

    editLog(date,clinic_id){
      this.logForm={date,clinic_id,consult:'',proc:''};
      this.fillLog();
      this.tab='rec';
      window.scrollTo({top:0,behavior:'smooth'});
    },
    fillLog(){
      const l=this.logs.find(l=>l.date===this.logForm.date&&
        l.clinic_id===this.logForm.clinic_id);
      this.logForm.consult=l?.consult_total??'';
      this.logForm.proc=l?.procedure_total??'';
    },
    async saveDaily(){
      const f=this.logForm;
      if(!f.clinic_id||!f.date||f.date>this.todayDate()){
        return this.fail('請選擇診所及有效日期，不能填未來實際收入。');
      }
      const valid=v=>v!==''&&v!=null&&Number.isFinite(Number(v))&&Number(v)>=0;
      if(!valid(f.consult)||!valid(f.proc)){
        return this.fail('兩項都要填寫；確定冇收入先填 0。');
      }
      const [year,month]=f.date.split('-').map(Number);
      if(this.invoices.some(i=>i.clinic_id===f.clinic_id&&i.year===year&&i.month===month)){
        return this.fail('此診所月份已有 Invoice。為免單據與收入不一致，不能直接修改；草稿可先刪除再重建。');
      }
      const {error}=await db.from('daily_logs').upsert({
        clinic_id:f.clinic_id,date:f.date,
        consult_total:Number(f.consult),
        procedure_total:Number(f.proc)
      },{onConflict:'clinic_id,date'});
      if(error)return this.fail(error);
      const difference=(year-this.y)*12+month-this.m;
      if(difference)await this.shift(difference);
      else await this.load();
      if(this.err)return;
      this.fillLog();
      this.flash('診金記錄已儲存');
    },

    async saveRule(){
      if(Calc.hoursOf(this.ruleForm)<=0){
        return this.fail('結束時間必須遲於開始時間；跨夜更請拆開輸入。');
      }
      return await original.addRule.call(this);
    },
    async saveExtraChecked(){
      const f=this.extraForm;
      if(Number(f.hours)<0 ||
         (f.fixed_amount!==''&&Number(f.fixed_amount)<0)){
        return this.fail('時數及金額不能為負數。');
      }
      return await original.addExtra.call(this);
    },

    async invoiceChecked(row){
      const c=row.clinic;
      if(this.invOf(c.id))return this.fail('此診所本月已有 Invoice。');
      if(!this.issueDate)return this.fail('請填發出日期。');
      if(!this.attOk)return this.fail('無法讀取返工確認，暫時不能開單。');
      if(c.procedure_pct==null){
        return this.fail('請先在診所設定填小手術分成百分比；沒有分成請填 0。');
      }
      const sessions=this.result.sessions.filter(s=>s.clinic_id===c.id);
      const logs=this.monthLogs().filter(l=>l.clinic_id===c.id);
      const dates=new Set([...sessions.map(s=>s.date),...logs.map(l=>l.date)]);
      if(!dates.size)return this.fail('本月沒有可開單記錄。');
      for(const date of dates){
        if(date>this.todayDate()){
          return this.fail('本月仍有未來排班，尚未能產生全月 Invoice。');
        }
        if(!this.att.some(a=>a.clinic_id===c.id&&a.date===date)){
          return this.fail(`${date} 尚未確認返工，請先到月曆確認。`);
        }
      }
      const requiresShare=Number(c.consult_pct)>0||Number(c.procedure_pct)>0;
      if(requiresShare){
        const missing=sessions.find(s=>s.kind!=='special'&&
          !logs.some(l=>l.date===s.date));
        if(missing)return this.fail(`${missing.date} 分成待填，暫時不能開單。`);
      }
      const inv=Calc2.buildInvoice(
        c,this.y,this.m,this.result.sessions,this.logs,this.issueDate
      );
      if(!Number.isFinite(inv.total)||inv.total<0){
        return this.fail('Invoice 金額無效，請檢查設定。');
      }
      if(!confirm(`產生 ${c.name} Invoice，合共 ${this.money(inv.total)}？`))return;
      return await this.add('invoices',{
        clinic_id:c.id,year:this.y,month:this.m,
        invoice_no:inv.invoice_no,issue_date:inv.issue_date,
        due_date:inv.due_date,total:inv.total,snapshot:inv.snapshot
      });
    },
    async reopenInvoice(inv){
      if(!confirm('確認改回未收款？實際收入不會因此改變。'))return;
      return await this.setStatus(inv,'sent');
    }
  };
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
