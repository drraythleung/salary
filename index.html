<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糧單預算</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="config.js"></script>
<script defer src="holidays.js"></script>
<script defer src="calc.js"></script>
<script defer src="app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>[x-cloak]{display:none!important}</style>
</head>
<body class="bg-slate-100 text-slate-800" x-data="app()" x-cloak>

<!-- 載入中 -->
<div x-show="loading" class="text-center mt-24 text-slate-500">載入中…</div>

<!-- 登入 -->
<div x-show="!loading && !session" class="max-w-sm mx-auto mt-20 p-6 bg-white rounded-xl shadow">
  <h1 class="text-xl font-bold mb-4">🩺 糧單預算</h1>
  <form @submit.prevent="signIn()" class="space-y-3">
    <input type="email" x-model="email" placeholder="Email" class="w-full border rounded p-2" required>
    <input type="password" x-model="password" placeholder="密碼" class="w-full border rounded p-2" required>
    <button class="w-full bg-blue-600 text-white rounded p-2">登入</button>
  </form>
  <p class="text-red-600 text-sm mt-3" x-text="err"></p>
</div>

<!-- 主畫面 -->
<div x-show="session" class="max-w-3xl mx-auto pb-24">
  <header class="sticky top-0 z-10 bg-white shadow px-3 py-2 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <button @click="shift(-1)" class="px-3 py-1 bg-slate-100 rounded">‹</button>
      <div class="font-bold w-28 text-center" x-text="y + '年' + m + '月'"></div>
      <button @click="shift(1)" class="px-3 py-1 bg-slate-100 rounded">›</button>
    </div>
    <button @click="signOut()" class="text-sm text-slate-500">登出</button>
  </header>

  <div x-show="err" @click="err=''" class="m-3 p-2 bg-red-100 text-red-700 rounded text-sm" x-text="err"></div>
  <div x-show="ok" class="m-3 p-2 bg-green-100 text-green-700 rounded text-sm" x-text="ok"></div>

  <nav class="flex bg-white border-b text-sm">
    <button @click="tab='home'" :class="tab==='home' ? 'border-b-2 border-blue-600 text-blue-600 font-bold' : ''" class="flex-1 py-2">總覽</button>
    <button @click="tab='adj'" :class="tab==='adj' ? 'border-b-2 border-blue-600 text-blue-600 font-bold' : ''" class="flex-1 py-2">加節/調整</button>
    <button @click="tab='leave'" :class="tab==='leave' ? 'border-b-2 border-blue-600 text-blue-600 font-bold' : ''" class="flex-1 py-2">年假</button>
    <button @click="tab='clinic'" :class="tab==='clinic' ? 'border-b-2 border-blue-600 text-blue-600 font-bold' : ''" class="flex-1 py-2">診所</button>
  </nav>

  <!-- 總覽 -->
  <section x-show="tab==='home'" class="p-3 space-y-3">
    <div x-show="clinics.length===0" class="bg-yellow-50 border border-yellow-300 rounded p-3 text-sm">
      未有診所資料。請執行 Step 3 的 SQL,或到「診所」頁新增。
    </div>

    <template x-if="result.summary">
      <div class="space-y-3">
        <div class="bg-blue-600 text-white rounded-xl p-4">
          <div class="text-sm opacity-80">本月預計收入(未扣稅/MPF)</div>
          <div class="text-3xl font-bold" x-text="money(result.summary.total)"></div>
          <div class="text-xs mt-1 opacity-80">
            時薪/特更 <span x-text="money(result.summary.base)"></span>
            ＋ 分成估算 <span x-text="money(result.summary.commission)"></span>
          </div>
          <div x-show="result.summary.pending" class="text-xs mt-1 text-yellow-200">⚠ 部分診所小手術分成 % 未設定,未計入</div>
        </div>

        <div class="bg-white rounded-xl shadow divide-y">
          <template x-for="r in result.summary.rows" :key="r.clinic.id">
            <div class="p-3 text-sm">
              <div class="flex justify-between font-bold">
                <span x-text="r.clinic.name"></span><span x-text="money(r.total)"></span>
              </div>
              <div class="text-slate-500 text-xs">
                <span x-text="r.days"></span> 日 · <span x-text="r.hours"></span> 小時 ·
                時薪/特更 <span x-text="money(r.base)"></span>
                <template x-if="r.consult>0"><span> · 診金分成 <span x-text="money(r.consult)"></span></span></template>
                <template x-if="r.proc>0"><span> · 小手術 <span x-text="money(r.proc)"></span></span></template>
                <template x-if="r.pending"><span class="text-orange-600"> · 小手術%待定</span></template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- 已扣除 -->
    <details class="bg-white rounded-xl shadow p-3 text-sm" x-show="result.skipped.length">
      <summary class="cursor-pointer">已扣除 <span x-text="result.skipped.length"></span> 節(假期/年假/取消)</summary>
      <template x-for="(s,i) in result.skipped" :key="'k'+i">
        <div class="flex justify-between items-center py-1 border-b text-xs">
          <div><span x-text="dlabel(s.date)"></span> <span x-text="cl(s.clinic_id)"></span> <span x-text="blk(s.block)"></span>
            <span class="text-slate-500" x-text="s.reason"></span></div>
          <div>
            <button x-show="s.why==='holiday'" @click="quickWork(s)" class="text-blue-600">照常上班</button>
            <button x-show="s.why==='cancel'" @click="restore(s.ov_id)" class="text-blue-600">復原</button>
          </div>
        </div>
      </template>
    </details>

    <!-- 本月 session -->
    <div class="bg-white rounded-xl shadow p-3">
      <div class="font-bold text-sm mb-1">本月明細</div>
      <template x-for="(s,i) in result.sessions" :key="'s'+i">
        <div class="flex items-center justify-between py-2 border-b text-sm">
          <div>
            <span class="font-medium" x-text="dlabel(s.date)"></span>
            <span class="ml-1" x-text="cl(s.clinic_id)"></span>
            <span class="text-slate-500 ml-1" x-text="blk(s.block)"></span>
            <span x-show="s.kind==='extra'" class="ml-1 text-xs bg-green-100 text-green-700 rounded px-1">加節</span>
            <span x-show="s.kind==='special'" class="ml-1 text-xs bg-purple-100 text-purple-700 rounded px-1">特更</span>
            <span x-show="s.ov_id" class="ml-1 text-xs bg-yellow-100 text-yellow-700 rounded px-1">已調整</span>
          </div>
          <div class="text-right whitespace-nowrap">
            <span class="text-slate-500" x-text="s.hours + 'h'"></span>
            <span x-text="money(s.base)"></span>
            <button x-show="s.kind==='regular'" @click="quickCancel(s)" class="ml-2 text-red-600">取消</button>
            <button x-show="s.ov_id" @click="restore(s.ov_id)" class="ml-2 text-blue-600">還原</button>
            <button x-show="s.extra_id" @click="del('extra_sessions', s.extra_id)" class="ml-2 text-red-600">刪除</button>
          </div>
        </div>
      </template>
      <div x-show="!result.sessions.length" class="text-sm text-slate-400 py-2">本月冇 session</div>
    </div>
  </section>

  <!-- 加節 / 調整 -->
  <section x-show="tab==='adj'" class="p-3 space-y-4">
    <form @submit.prevent="addExtra()" class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
      <div class="font-bold">➕ 加節 / 代診 / 特更</div>
      <div class="grid grid-cols-2 gap-2">
        <label>診所
          <select x-model="extraForm.clinic_id" class="w-full border rounded p-1">
            <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
          </select></label>
        <label>日期<input type="date" x-model="extraForm.date" class="w-full border rounded p-1"></label>
        <label>時數<input type="number" step="0.5" x-model="extraForm.hours" class="w-full border rounded p-1"></label>
        <label>固定金額(特更才填)<input type="number" x-model="extraForm.fixed_amount" placeholder="例:14000" class="w-full border rounded p-1"></label>
      </div>
      <input x-model="extraForm.note" placeholder="備註(選填)" class="w-full border rounded p-1">
      <p class="text-xs text-slate-500">普通加節:填時數,按時薪計。特更:填固定金額(時數只作記錄,不加分成)。</p>
      <button class="bg-blue-600 text-white rounded px-4 py-1">新增</button>
    </form>

    <form @submit.prevent="addOverride()" class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
      <div class="font-bold">🛠 單日調整</div>
      <div class="grid grid-cols-2 gap-2">
        <label>日期<input type="date" x-model="ovForm.date" class="w-full border rounded p-1"></label>
        <label>診所
          <select x-model="ovForm.clinic_id" class="w-full border rounded p-1">
            <option value="">全部診所</option>
            <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
          </select></label>
        <label>時段
          <select x-model="ovForm.block" class="w-full border rounded p-1">
            <option value="all">全日</option><option value="am">上午</option><option value="pm">下午</option>
          </select></label>
        <label>動作
          <select x-model="ovForm.action" class="w-full border rounded p-1">
            <option value="work">照常上班 / 改時數</option><option value="cancel">取消</option>
          </select></label>
        <label>改時數(選填,要揀上午或下午)<input type="number" step="0.25" x-model="ovForm.hours" class="w-full border rounded p-1"></label>
        <label>備註<input x-model="ovForm.note" class="w-full border rounded p-1"></label>
      </div>
      <p class="text-xs text-slate-500">公眾假期要上班:揀「照常上班」。病假或臨時取消:揀「取消」。也可以在總覽頁直接撳「取消」。</p>
      <button class="bg-blue-600 text-white rounded px-4 py-1">新增</button>
    </form>
  </section>

  <!-- 年假 -->
  <section x-show="tab==='leave'" class="p-3 space-y-4">
    <form @submit.prevent="addLeave()" class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
      <div class="font-bold">🌴 新增年假 / 旅行</div>
      <div class="grid grid-cols-2 gap-2">
        <label>開始<input type="date" x-model="leaveForm.start_date" class="w-full border rounded p-1"></label>
        <label>結束(單日可留空)<input type="date" x-model="leaveForm.end_date" class="w-full border rounded p-1"></label>
        <label>時段
          <select x-model="leaveForm.period" class="w-full border rounded p-1">
            <option value="full">全日</option><option value="am">只放上午</option><option value="pm">只放下午</option>
          </select></label>
        <label>原因<input x-model="leaveForm.reason" placeholder="例:日本旅行" class="w-full border rounded p-1"></label>
      </div>
      <button class="bg-blue-600 text-white rounded px-4 py-1">新增</button>
    </form>
    <div class="bg-white rounded-xl shadow divide-y">
      <template x-for="l in leaves" :key="l.id">
        <div class="p-3 text-sm flex justify-between">
          <div><span x-text="l.start_date"></span> → <span x-text="l.end_date"></span>
            <span class="text-slate-500" x-text="({full:'全日',am:'上午',pm:'下午'})[l.period]"></span>
            <span class="text-slate-500" x-text="l.reason || ''"></span></div>
          <button @click="del('leaves', l.id)" class="text-red-600">刪除</button>
        </div>
      </template>
      <div x-show="!leaves.length" class="p-3 text-sm text-slate-400">未有年假記錄</div>
    </div>
  </section>

  <!-- 診所 -->
  <section x-show="tab==='clinic'" class="p-3 space-y-4">
    <template x-for="c in clinics" :key="c.id">
      <div class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
        <div class="flex justify-between items-center">
          <b x-text="c.name"></b>
          <label><input type="checkbox" x-model="c.active"> 啟用</label>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <label>代號<input x-model="c.code" class="w-full border rounded p-1"></label>
          <label>名稱<input x-model="c.name" class="w-full border rounded p-1"></label>
          <label>時薪 HK$<input type="number" x-model.number="c.hourly_rate" class="w-full border rounded p-1"></label>
          <label>付款期限(日)<input type="number" x-model.number="c.payment_terms_days" class="w-full border rounded p-1"></label>
          <label>診金分成 %<input type="number" x-model.number="c.consult_pct" class="w-full border rounded p-1"></label>
          <label>小手術分成 %(留空=待定)<input type="number" x-model.number="c.procedure_pct" class="w-full border rounded p-1"></label>
          <label>預計每日診金總額<input type="number" x-model.number="c.est_consult_per_day" class="w-full border rounded p-1"></label>
          <label>預計每日小手術總額<input type="number" x-model.number="c.est_procedure_per_day" class="w-full border rounded p-1"></label>
        </div>
        <div class="text-xs text-slate-600">
          固定時段:
          <template x-for="r in rulesOf(c.id)" :key="r.id">
            <span class="inline-block bg-slate-100 rounded px-2 py-0.5 mr-1 mb-1">
              星期<span x-text="wk(r.weekday)"></span> <span x-text="blk(r.block)"></span>
              <span x-text="hm(r.start_time) + '–' + hm(r.end_time)"></span>
              <button @click="del('schedule_rules', r.id)" class="text-red-600 ml-1">✕</button>
            </span>
          </template>
        </div>
        <button @click="saveClinic(c)" class="bg-blue-600 text-white rounded px-4 py-1">儲存</button>
      </div>
    </template>

    <form @submit.prevent="addRule()" class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
      <div class="font-bold">➕ 新增固定時段</div>
      <div class="grid grid-cols-2 gap-2">
        <label>診所
          <select x-model="ruleForm.clinic_id" class="w-full border rounded p-1">
            <template x-for="c in clinics" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
          </select></label>
        <label>星期
          <select x-model.number="ruleForm.weekday" class="w-full border rounded p-1">
            <option value="1">一</option><option value="2">二</option><option value="3">三</option><option value="4">四</option>
            <option value="5">五</option><option value="6">六</option><option value="0">日</option>
          </select></label>
        <label>段
          <select x-model="ruleForm.block" class="w-full border rounded p-1">
            <option value="am">上午</option><option value="pm">下午</option>
          </select></label>
        <div class="grid grid-cols-2 gap-1">
          <label>開始<input type="time" x-model="ruleForm.start_time" class="w-full border rounded p-1"></label>
          <label>結束<input type="time" x-model="ruleForm.end_time" class="w-full border rounded p-1"></label>
        </div>
      </div>
      <button class="bg-blue-600 text-white rounded px-4 py-1">新增時段</button>
    </form>

    <form @submit.prevent="addClinic()" class="bg-white rounded-xl shadow p-3 space-y-2 text-sm">
      <div class="font-bold">➕ 新增診所</div>
      <div class="grid grid-cols-3 gap-2">
        <input x-model="newClinic.code" placeholder="代號" class="border rounded p-1">
        <input x-model="newClinic.name" placeholder="名稱" class="border rounded p-1">
        <input type="number" x-model="newClinic.hourly_rate" placeholder="時薪" class="border rounded p-1">
      </div>
      <button class="bg-blue-600 text-white rounded px-4 py-1">新增診所</button>
    </form>
  </section>
</div>
</body>
</html>
